<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yahrzeit Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Suez+One&display=swap" rel="stylesheet">
<style>
  :root{
    --wall-dark: #6f5236;
    --wall-mid: #8a6a45;
    --teak-hi: #9c7a52;
    --teak-mid: #8a6a45;
    --teak-low: #6f5236;
    --bronze-hi: #f0d48a;
    --bronze-mid: #d9b25c;
    --bronze-low: #b8863f;
    --gold: #e8c468;
    --plate-text: #4a3319;
    --glow: #fff0c2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: linear-gradient(155deg, var(--teak-hi) 0%, var(--teak-mid) 50%, var(--teak-low) 100%);
    font-family:'Cormorant Garamond', serif;
    color:var(--plate-text);
    display:flex; align-items:center; justify-content:center;
  }
  .board-outer{
    position:relative;
    width:calc(100vw - 3vmin); height:calc(100vh - 3vmin); max-width:1900px;
  }
  .hanging-lamp{
    flex-shrink:0;
    width:19vh; height:19vh;
  }
  .board-frame{
    width:100%; height:100%;
    padding:2.2vh 2.2vw 2.2vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    background: linear-gradient(155deg, #eaddc0 0%, #dcc9a0 55%, #c9ae7c 100%);
    border-radius:14px;
    border: 4px solid var(--gold);
    box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 0 25px rgba(0,0,0,0.28);
  }
  .header{
    flex-shrink:0;
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center;
    padding:0.8vh 3vw;
    margin-bottom:1vh;
    background: linear-gradient(180deg, var(--bronze-hi) 0%, var(--bronze-mid) 45%, var(--bronze-low) 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), inset 0 -3px 8px rgba(0,0,0,0.5), 0 6px 18px rgba(0,0,0,0.5);
    border-radius:4px;
  }
  .header .header-side{
    display:flex; align-items:center; gap:1vw;
  }
  .header .header-candle{ flex-shrink:0; width:calc(var(--board-scale, 1) * 3vh); height:calc(var(--board-scale, 1) * 9vh); }
  .header .header-lamp{
    flex-shrink:0; width:calc(var(--board-scale, 1) * 10vh); height:calc(var(--board-scale, 1) * 14.6vh);
    object-fit: contain;
    transform: translateY(1.2vh);
    position: relative; z-index: 3;
    filter: drop-shadow(0 0 8px rgba(255,180,60,0.5));
  }
  .header .shul-name{
    display:block; flex:1; text-align:center;
    font-family:'Suez One', serif; font-size:calc(var(--board-scale, 1) * 6.6vh); letter-spacing:1px; font-weight:700;
    color:#0c0704; text-shadow:none;
  }
  .header .header-subtitle{
    display:block; flex:1; text-align:center;
    font-family:'Suez One', serif; font-size:calc(var(--board-scale, 1) * 6.6vh); letter-spacing:0.5px; font-weight:700;
    color:#0c0704; text-shadow:none;
  }
  .grid{
    flex:1; min-height:0;
    display:grid;
    gap:0.4vh 1.2vw; padding:1vh 0.4vw 0.4vh;
  }
  .plaque{
    position:relative; min-height:0; padding:0.4vh 1.4vw; border-radius:3px;
    display:flex; flex-direction:column; justify-content:center;
    background: linear-gradient(180deg, var(--bronze-hi) 0%, var(--bronze-mid) 50%, var(--bronze-low) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -2px 4px rgba(0,0,0,0.45), 0 2px 5px rgba(0,0,0,0.45);
    transition: box-shadow .6s ease, filter .6s ease;
    overflow:hidden;
    --pf-scale: 1;
  }
  .plaque .heb{
    font-family:'Suez One', serif;
    font-size:calc(var(--pf-scale) * 11vh); font-weight:400; color:#0c0704; text-align:center;
    text-shadow:none; line-height:1.05;
  }
  .plaque .name{
    font-family:'Cinzel', serif; font-size:calc(var(--pf-scale) * 3.8vh); letter-spacing:0.5px; font-weight:800;
    color:#0c0704; text-shadow:none; margin-top:0.5vh;
  }
  .plaque .date{ font-family:'Suez One', serif; font-size:calc(var(--pf-scale) * 9.5vh); font-weight:400; color:#0c0704; margin-top:0.1vh; letter-spacing:0.5px; text-align:center; white-space:nowrap; text-shadow: 0 0 0.6px #0c0704, 0 0 0.6px #0c0704, 0 0 0.3px #0c0704; -webkit-text-stroke: 0.4px #0c0704; }
  .plaque .mini-candle{
    position:absolute; top:50%; transform:translateY(-50%);
    width:2.2vh; flex-shrink:0;
    opacity:0.32; filter:grayscale(65%) brightness(0.8);
    transition: opacity .6s ease, filter .6s ease;
  }
  .plaque .mini-candle.left{ left:0.5vw; }
  .plaque .mini-candle.right{ right:0.5vw; }
  .plaque.lit .mini-candle{
    opacity:1; filter:none;
  }
  .bulb{
    position:absolute; top:50%; transform:translateY(-50%);
    width:1.6vh; height:1.6vh; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #6b5638, #2a2013);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
  }
  .bulb.bulb-left{ left:0.9vw; }
  .bulb.bulb-right{ right:0.9vw; }
  .plaque.reserved{
    min-height:0;
    background: linear-gradient(180deg, #6b5636 0%, #4a3a22 60%, #362a17 100%);
    display:flex; align-items:center; justify-content:center; padding:1.4vh 1vw;
  }
  .donor-cell{
    position:relative; min-height:0; padding:1vh 1.5vw; border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(180deg, var(--bronze-mid), var(--bronze-low));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -2px 4px rgba(0,0,0,0.45), 0 4px 10px rgba(0,0,0,0.4);
  }
  .donor-cell span{
    font-family:'Suez One', serif; font-size:2.6vh; font-weight:400; letter-spacing:1px;
    color:#4a3319; text-shadow:none; text-align:center;
  }
  .center-panel{
    min-height:0; padding:1vh 0.4vw; border-radius:6px;
    overflow:hidden;
    background: linear-gradient(155deg, #eaddc0 0%, #dcc9a0 55%, #c9ae7c 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 6px rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.3);
    display:flex; flex-direction:column;
  }
  .center-panel .panel-header{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center; gap:0.8vw;
    padding-bottom:0.5vh; margin-bottom:0.5vh;
    border-bottom: 2px solid var(--bronze-mid);
  }
  .center-panel .panel-header .lamp-small{ width:calc(var(--board-scale, 1) * 5.4vh); height:calc(var(--board-scale, 1) * 9vh); flex-shrink:0; }
  .center-panel .panel-header-text{ display:flex; flex-direction:column; align-items:center; }
  .center-panel .panel-header .panel-verse{
    font-family:'Suez One', serif; font-size:calc(var(--board-scale, 1) * 2.6vh); color:#4a3319; font-style:italic;
    margin-bottom:0.2vh; white-space:nowrap;
  }
  .center-panel .panel-header .panel-title{
    font-family:'Suez One', serif; font-size:calc(var(--board-scale, 1) * 3.2vh); color:#4a3319;
  }
  .center-panel .panel-header .panel-today-date{
    font-family:'Suez One', serif; font-size:calc(var(--board-scale, 1) * 2.4vh); color:#6b5636; margin-top:0.2vh;
  }
  .center-panel .panel-list{
    flex:1; min-height:0;
    display:flex; flex-direction:column; justify-content:center; gap:0.5vh;
  }
  .center-row{
    flex:0 0 auto; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:0.3vw;
    padding:0.6vh 0.3vw; border-radius:3px;
    background: linear-gradient(180deg, var(--bronze-hi) 0%, var(--bronze-mid) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -1px 3px rgba(0,0,0,0.35);
    transition: background .5s ease, box-shadow .5s ease;
  }
  .center-row.lit{
    justify-content:space-between;
    padding:1.6vh 0.6vw;
    background: linear-gradient(180deg, #f7dfa0 0%, #e8b84f 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -1px 3px rgba(0,0,0,0.3),
      0 0 16px 4px rgba(255,207,107,0.75);
    border: 1px solid #fff3c4;
  }
  .center-row .center-text{
    display:flex; flex-direction:column; align-items:center;
    font-family:'Suez One', serif; color:#0c0704;
    line-height:1.1; direction:rtl;
  }
  .center-row.lit .center-text{
    flex:1; min-width:0;
  }
  .center-row .center-name{
    font-size: calc(var(--panel-scale, 1) * 11vh);
    text-align:center;
  }
  .center-row .center-date{
    font-size: calc(var(--panel-scale, 1) * 9.5vh);
    -webkit-text-stroke: 0.35px #0c0704;
    margin-top:0.05vh; text-align:center;
  }
  .center-row.lit .center-name{
    font-weight:700;
  }
  .center-row.lit .center-date{
    font-weight:700;
  }
  .center-row .candle{ width:3.4vh; flex-shrink:0; }
  .center-row.lit .candle{ width:3.8vh; }
  .center-panel .panel-donor{
    flex-shrink:0; text-align:center; margin-top:0.5vh; padding-top:0.4vh;
    border-top: 2px solid var(--bronze-mid);
    font-family:'Suez One', serif; font-size:calc(var(--board-scale, 1) * 1.8vh); color:#4a3319;
  }
  .plaque.reserved .label{ font-family:'Cinzel', serif; font-size:1.8vh; letter-spacing:3px; color:rgba(30,20,10,0.55); }
  .plaque.lit{
    filter:saturate(1.15);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.35),
      0 0 14px 4px rgba(255,207,107,0.55), 0 0 34px 10px rgba(255,180,60,0.35);
    animation: flicker 3.2s ease-in-out infinite;
  }
  .plaque.lit .bulb{
    background: radial-gradient(circle at 35% 30%, #fff3cf, var(--glow) 55%, #c98a2a 100%);
    box-shadow: 0 0 6px 2px var(--glow), 0 0 16px 6px rgba(255,207,107,0.8);
  }
  .bulb.always-on{
    background: radial-gradient(circle at 35% 30%, #fff3cf, var(--glow) 55%, #c98a2a 100%);
    box-shadow: 0 0 6px 2px var(--glow), 0 0 16px 6px rgba(255,207,107,0.8);
  }
  @keyframes flicker{
    0%,100%{ box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.35),
      0 0 14px 4px rgba(255,207,107,0.55), 0 0 34px 10px rgba(255,180,60,0.35); }
    50%{ box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.35),
      0 0 18px 6px rgba(255,207,107,0.7), 0 0 42px 14px rgba(255,180,60,0.45); }
  }
  #screensaver{
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    transition: opacity 3s ease; z-index:999;
  }
  #screensaver.active{ opacity:1; pointer-events:all; }

  /* ── FULLSCREEN BUTTON (mobile only) ───────────────────────── */
  #fullscreen-btn { display: none; position: fixed; bottom: 16px; right: 16px; z-index: 9999; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50px; padding: 10px 18px; font-size: 16px; cursor: pointer; backdrop-filter: blur(4px); }
  @media (max-width: 1024px) and (pointer: coarse) { #fullscreen-btn { display: block; } }
</style>
</head>

<script>
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
    }
  }

  // ---- CONFIG (set per shul) ----
  const BOARD_API_URL = 'https://script.google.com/macros/s/AKfycbyn2bOEYISpbK_OdNXMxLIootm5-L6JlommTJwxbrTWvnod_3f5C10-2X5NhreZNS9y/exec'; // Kahal Chassidim
  const SHOW_ENGLISH_NAME = false;
  const DEFAULT_TOTAL_PLAQUE_COLUMNS = 6; // used only if the Settings tab doesn't have TotalPlaqueColumns yet
  const DEFAULT_ROWS_PER_COLUMN = 10; // used only if the Settings tab doesn't have RowsPerColumn yet

  async function loadBoard(){
    const res = await fetch(BOARD_API_URL);
    const data = await res.json();
    render(data);
  }

  function render(data){
    document.getElementById('headerShulName').textContent = data.settings.HeaderEyebrow || '';
    document.getElementById('headerSubtitle').textContent = data.settings.HeaderDedication || '';

    // Total plaque columns, gabbai-editable from the Settings tab — must be
    // even (split evenly left/right); falls back to the default above if
    // the sheet doesn't have this row yet, or it isn't a valid even number.
    let totalPlaqueColumns = parseInt(data.settings.TotalPlaqueColumns, 10);
    if (!totalPlaqueColumns || totalPlaqueColumns < 2 || totalPlaqueColumns % 2 !== 0) {
      totalPlaqueColumns = DEFAULT_TOTAL_PLAQUE_COLUMNS;
    }
    const MIN_SIDE_COLUMNS = totalPlaqueColumns / 2;

    // Rows per column — same idea: fewer empty RESERVED rows for a smaller
    // congregation means each plaque also gets more room to be bigger.
    // Falls back to the default if the sheet doesn't have this row yet.
    let ROWS_PER_COLUMN = parseInt(data.settings.RowsPerColumn, 10);
    if (!ROWS_PER_COLUMN || ROWS_PER_COLUMN < 1) {
      ROWS_PER_COLUMN = DEFAULT_ROWS_PER_COLUMN;
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    // People whose Hebrew month matches the current month go in the center
    // panel ONLY — pulled out of their normal side-grid slot entirely while
    // it's their month (per your call: not duplicated in both places).
    const thisMonthPeople = data.people.filter(p => p.hebMonth === data.currentMonth);
    const rawSidePeople = data.people.filter(p => p.hebMonth !== data.currentMonth);

    // Re-compact slot numbers fresh on every render, based on actual
    // headcount — rather than trusting the raw slot numbers from the sheet
    // as-is. Those can end up with gaps over time (anything ever deleted
    // leaves a permanent hole), and a gap looks exactly like an empty
    // RESERVED box sitting where a real person should be — which is also
    // what was silently forcing extra columns to open up even with a small
    // real headcount. Sorting by whatever slot order already exists keeps
    // people in the same relative order as before; this never touches the
    // sheet, it's purely how the board lays itself out.
    const sidePeople = rawSidePeople
      .slice()
      .sort((a, b) => (a.slot || 0) - (b.slot || 0))
      .map((p, i) => ({ ...p, slot: i + 1 }));

    // Columns are strictly fixed to TotalPlaqueColumns, no exceptions — if
    // actual headcount ever exceeds what columns×rows can hold, the extras
    // simply won't get a rendered slot rather than the board growing wider
    // to compensate. That's a deliberate, explicit choice: exact size
    // control takes priority over auto-accommodating every possible
    // headcount.
    const sideColumnsEach = MIN_SIDE_COLUMNS;
    const totalColumns = sideColumnsEach*2 + 2; // +2 for the center panel
    const centerStart = sideColumnsEach + 1; // 1-indexed

    // Header/center-panel-header/donor text and icons scale up when the
    // board is configured smaller (more breathing room per column) and
    // back down if it ever grows busier than a standard 6-wide board —
    // compared against that fixed reference, not against its own configured
    // width, since comparing a setting against itself can never show it as
    // "smaller." Using sqrt keeps the effect gentle rather than swinging
    // wildly, and it's clamped so it never gets silly either direction.
    const BASELINE_TOTAL_COLUMNS = 6;
    const actualTotalColumnsInUse = sideColumnsEach * 2;
    const boardScale = Math.max(0.85, Math.min(1.4, Math.sqrt(BASELINE_TOTAL_COLUMNS / actualTotalColumnsInUse)));
    document.documentElement.style.setProperty('--board-scale', boardScale);

    grid.style.gridTemplateColumns = `repeat(${sideColumnsEach}, 1fr) 0.6fr 0.6fr repeat(${sideColumnsEach}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${ROWS_PER_COLUMN}, 1fr)`;

    const bySlot = {};
    sidePeople.forEach(p => bySlot[p.slot] = p);

    // Right side fills first (outermost edge inward), then left side
    // (innermost, next to center, outward) — right to left overall.
    const PHYSICAL_COLS = [];
    for(let k=0;k<sideColumnsEach;k++) PHYSICAL_COLS.push(totalColumns - k);
    for(let k=0;k<sideColumnsEach;k++) PHYSICAL_COLS.push(centerStart - 1 - k);

    const buildCandle = (slot, extraClass) => `<svg class="candle${extraClass ? ' ' + extraClass : ''}" viewBox="0 0 30 40">
      <defs>
        <radialGradient id="candleGlow${slot}" cx="50%" cy="30%" r="60%">
          <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#fff3c4" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="15" cy="12" r="11" fill="url(#candleGlow${slot})">
        <animate attributeName="r" values="10;13;10" dur="2s" repeatCount="indefinite"/>
      </circle>
      <rect x="10" y="20" width="10" height="18" rx="1" fill="#e8ddc0"/>
      <line x1="15" y1="20" x2="15" y2="14" stroke="#8a6a3f" stroke-width="1"/>
      <path d="M 15 14 Q 20 8 15 0 Q 10 8 15 14 Z" fill="#ffb347">
        <animate attributeName="opacity" values="1;0.75;1" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 15 12 Q 17.5 8 15 4 Q 12.5 8 15 12 Z" fill="#fff3c4">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </svg>`;

    const totalSideSlots = sideColumnsEach * 2 * ROWS_PER_COLUMN;
    for(let i=0;i<totalSideSlots;i++){
      const colIndex = Math.floor(i / ROWS_PER_COLUMN);
      const r = i % ROWS_PER_COLUMN;
      const c = PHYSICAL_COLS[colIndex];
      const slotNum = i + 1;
      const p = bySlot[slotNum];
      const el = document.createElement('div');
      el.style.gridColumn = c;
      el.style.gridRow = r+1;
      if(p){
        const hasName = SHOW_ENGLISH_NAME && p.name;
        el.className = 'plaque' + (hasName ? '' : ' no-name') + (p.lit ? ' lit' : '');
        el.innerHTML = `
          ${buildCandle('p'+slotNum+'_l', 'mini-candle left')}
          <div class="heb">${p.displayName || ''}</div>
          ${hasName ? `<div class="name">${p.name}</div>` : ''}
          <div class="date">${p.hebDateDisplay || ''}</div>
          ${buildCandle('p'+slotNum+'_r', 'mini-candle right')}
        `;
      } else {
        el.className = 'plaque reserved';
        el.innerHTML = `<div class="label">RESERVED</div>`;
      }
      grid.appendChild(el);
    }

    // Center panel: full height, spans the 2 reserved center columns.
    const panel = document.createElement('div');
    panel.className = 'center-panel';
    panel.style.gridColumn = `${centerStart} / span 2`;
    panel.style.gridRow = `1 / span ${ROWS_PER_COLUMN}`;


    const rowsHtml = thisMonthPeople
      .slice().sort((a,b)=>a.hebDay-b.hebDay)
      .map(p => {
        const isToday = p.hebDay === data.todayDay;
        return `
          <div class="center-row${isToday ? ' lit' : ''}">
            ${isToday ? buildCandle(p.slot) : ''}
            <span class="center-text">
              <span class="center-name">${p.displayName || ''}</span>
              <span class="center-date">${p.hebDateDisplay || ''}</span>
            </span>
            ${isToday ? buildCandle(p.slot + '_r') : ''}
          </div>`;
      }).join('');

    panel.innerHTML = `
      <div class="panel-header">
        <svg class="lamp-small" viewBox="0 0 60 100">
          <defs>
            <radialGradient id="lampGlowSmall" cx="50%" cy="70%" r="50%">
              <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="lampBodySmall" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#b8863f"/>
              <stop offset="45%" stop-color="#f0d48a"/>
              <stop offset="100%" stop-color="#b8863f"/>
            </linearGradient>
          </defs>
          <circle cx="30" cy="60" r="24" fill="url(#lampGlowSmall)">
            <animate attributeName="r" values="22;27;22" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <line x1="30" y1="0" x2="30" y2="18" stroke="#b8863f" stroke-width="2"/>
          <circle cx="30" cy="18" r="4" fill="#e8c468"/>
          <path d="M 10 18 L 50 18 L 39 52 L 21 52 Z" fill="url(#lampBodySmall)" stroke="#8a6a3f" stroke-width="1"/>
          <ellipse cx="30" cy="52" rx="9" ry="3" fill="#8a6a3f"/>
          <path d="M 30 52 Q 37 64 30 78 Q 23 64 30 52 Z" fill="#fff0c2">
            <animate attributeName="opacity" values="1;0.8;1" dur="2.2s" repeatCount="indefinite"/>
          </path>
          <path d="M 30 58 Q 34 66 30 74 Q 26 66 30 58 Z" fill="#ffb347">
            <animate attributeName="opacity" values="0.9;1;0.9" dur="2.2s" repeatCount="indefinite"/>
          </path>
        </svg>
        <div class="panel-header-text">
          <span class="panel-verse">נר ה' נשמת אדם</span>
          <span class="panel-title">${data.currentMonthHebrew ? 'חודש ' + data.currentMonthHebrew : ''}</span>
        </div>
      </div>
      <div class="panel-list">${rowsHtml}</div>
      <div class="panel-donor">${data.settings.DonorText || ''}</div>
    `;
    grid.appendChild(panel);

    fitPlaqueText();
    fitPanelText();
    // Belt-and-suspenders against the swap-timing gap: explicitly request
    // the exact fonts/weights this board uses and re-fit once they're
    // truly ready, then one more delayed pass as a final safety net.
    Promise.all([
      document.fonts.load('400 10vh "Suez One"'),
      document.fonts.load('700 10vh "Suez One"'),
      document.fonts.load('800 10vh "Cinzel"'),
    ]).catch(() => {}).then(() => { fitPlaqueText(); fitPanelText(); });
    setTimeout(() => { fitPlaqueText(); fitPanelText(); }, 500);
  }

  // Auto-shrinks each plaque's text scale until its content fits without
  // clipping — same measure-and-fit approach as the status-box sizing on
  // the other two boards, since name length/line-wrap varies per person
  // and a single fixed font size can't safely fit every case.
  function fitPlaqueText(){
    document.fonts.ready.then(() => {
      const plaques = Array.from(document.querySelectorAll('.plaque:not(.reserved)'));

      // Each plaque fits only to ITS OWN content — no board-wide uniform
      // step, so a short name fills its box near full size instead of being
      // capped down to match the longest name elsewhere. Also keeps working
      // correctly as more plaques are added later.
      //
      // Binary search rather than a linear step-down: names can flip
      // between wrapping to 2 lines and fitting on 1 line depending on the
      // exact scale, and a coarse fixed step can step right past the point
      // where a name stops needing to wrap — settling on a small 2-line
      // result when a noticeably larger 1-line result was reachable just
      // below the step it happened to stop at. Binary search converges on
      // the true largest-fitting scale regardless of that discontinuity.
      const FLOOR = 0.12;
      plaques.forEach(el => {
        let lo = FLOOR, hi = 1.0;
        for (let i = 0; i < 18; i++) {
          const mid = (lo + hi) / 2;
          el.style.setProperty('--pf-scale', mid);
          if (el.scrollHeight <= el.clientHeight && el.scrollWidth <= el.clientWidth) {
            lo = mid;
          } else {
            hi = mid;
          }
        }
        el.style.setProperty('--pf-scale', lo);
      });
    });
  }

  // Same measure-and-fit approach for the center panel's row list — the
  // number of rows varies month to month, so text needs to shrink to fit
  // whatever the current month's count happens to be.
  // Same measure-and-fit approach as fitPlaqueText: check each row
  // individually (both width, since names can wrap, and height), find the
  // smallest scale any row needs, then apply that one scale to every row
  // so sizing stays uniform across the whole center list.
  // Rows now size to their natural content, same as a plaque does — so a
  // row can never clip its own text. The one remaining risk is the *total*
  // stack of rows running taller than the column allows (e.g. an unusually
  // busy month), so this shrinks everything uniformly only if needed.
  function fitPanelText(){
    document.fonts.ready.then(() => {
      const list = document.querySelector('.panel-list');
      const rows = Array.from(document.querySelectorAll('.center-row'));
      if (!list || !rows.length) return;

      const gap = parseFloat(getComputedStyle(list).rowGap) || 0;
      function contentHeight(){
        return rows.reduce((sum, r) => sum + r.offsetHeight, 0) + gap * (rows.length - 1);
      }
      function setScale(s){
        list.style.setProperty('--panel-scale', s);
      }

      // A linear "shrink by the overflow ratio" guess doesn't work here:
      // as text grows, names start wrapping onto extra lines, which jumps
      // height in sudden steps rather than growing smoothly — that breaks
      // any assumption of proportionality. Binary search sidesteps that
      // entirely: it makes no assumption about the relationship, it just
      // directly measures each candidate and narrows in on the largest
      // scale that actually fits.
      let lo = 0.15, hi = 4;
      for (let i = 0; i < 22; i++) {
        const mid = (lo + hi) / 2;
        setScale(mid);
        if (contentHeight() <= list.clientHeight) {
          lo = mid; // fits — try bigger
        } else {
          hi = mid; // too big — back off
        }
      }
      setScale(lo);
    });
  }

  loadBoard();
  setInterval(loadBoard, 5 * 60 * 1000); // refresh every 5 minutes

  // Mobile browsers show/hide their address bar as the page settles —
  // changing the real usable height *after* the initial fit already ran,
  // with no user action involved. Re-fit whenever that happens so the
  // board always matches the actual available space, not just whatever
  // height existed at the first render.
  let resizeDebounce;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => { fitPlaqueText(); fitPanelText(); }, 150);
  });

  // Night screensaver — dims to black 1:00 AM to 5:00 AM, kiosk's local clock
  function updateScreensaver(){
    const h = new Date().getHours();
    const isNight = h >= 1 && h < 5;
    document.getElementById('screensaver').classList.toggle('active', isNight);
  }
  updateScreensaver();
  setInterval(updateScreensaver, 60 * 1000); // check every minute
</script>
</body>
</html>
