// ── זמנים התפילה בימי חול — always-visible davening box ─────────────
// Genuinely separate from the live זמני היום list: every line shows every
// day (no day-of-week hiding), only the שחרית line's label/time swaps
// based on Rosh Chodesh/Chol HaMoed proximity, and the early Mincha line
// disappears entirely when its toggle is off. Manual overrides (set via
// the Manager app) replace the computed value for שחרית or מנחה-מעריב
// when today falls inside an override's date range.
function renderTefilaBox(now, dayW, holidayText, cSec, tachanunEveCutoff) {
    if (!EL['ZMANIM_TEFILA']) return;

    // שחרית (יום א') — always its own fixed time, untouched by the
    // RC/Chol HaMoed swap or by overrides (those only affect the main line).
    let shSunSec = parse24ToSec(shacharisSunday);

    // Regular שחרית line — swaps label+time to Rosh Chodesh/Chol HaMoed from
    // the SAME evening-before moment "אין אומרים תחנון" itself actually
    // starts showing (the Mincha-eve extension, 30 min before Shkiah — NOT
    // the head-box's own RC display, which uses a later, different cutoff
    // of 25 min before RT). Through midday of the day itself (today is
    // RC/CHM and before noon). Previously had no time gate at all, so it
    // triggered at midnight — many hours before it's actually relevant.
    // "Tomorrow is still special" keeps the window open on its own through
    // multi-day Chol HaMoed / 2-day Rosh Chodesh.
    let tomorrow     = new Date(now.getTime() + 86400000);
    let tomorrowText = (schedule[getIso(tomorrow)] || {}).holidayText || "";
    let isBeforeMidday = cSec < 43200;

    let tomorrowIsRC  = tomorrowText.includes("ראש חודש") && cSec >= tachanunEveCutoff;
    let tomorrowIsCHM = tomorrowText.includes("חול המועד") && cSec >= tachanunEveCutoff;
    let todayIsRC     = holidayText.includes("ראש חודש");
    let todayIsCHM    = holidayText.includes("חול המועד");

    let shLabel = 'שחרית', shSec = parse24ToSec(shacharisWeekday);
    if (tomorrowIsRC || (todayIsRC && isBeforeMidday)) {
        shLabel = 'שחרית ראש חודש'; shSec = parse24ToSec(shacharisRoshChodesh);
    } else if (tomorrowIsCHM || (todayIsCHM && isBeforeMidday)) {
        shLabel = 'שחרית חול המועד'; shSec = parse24ToSec(shacharisCholHamoed);
    }
    // Manual override replaces just the time — the label above still stands.
    if (shacharisOverride) {
        let ovrSec = parse24ToSec(shacharisOverride);
        if (ovrSec != null) shSec = ovrSec;
    }

    // מנחה — early minyan, fixed 2:15 PM, shown only when the toggle is on.
    let earlyMinchaSec = minchaEarlyEnabled ? parse24ToSec(EARLY_MINCHA_TIME) : null;

    // מנחה-מעריב — live weekly average (this week's Sun–Thu שקיעה minus the
    // editable offset), or the manual override if one is active today.
    let minchaMaarivSec = null;
    if (minchaMaarivOverride) {
        minchaMaarivSec = parse24ToSec(minchaMaarivOverride);
    } else {
        let weekSunday = new Date(now.getTime() - dayW*86400000);
        let total = 0, count = 0;
        for (let i = 0; i <= 4; i++) {
            let di = new Date(weekSunday.getTime() + i*86400000);
            let dS = schedule[getIso(di)];
            if (dS && dS.z && dS.z[9]) {
                let sec = getSec(dS.z[9], true);
                if (sec > 0) { total += sec; count++; }
            }
        }
        if (count > 0) {
            let avgSec    = Math.round(total / count);
            let offsetSec = (Number(minchaOffsetMinutes) || 10) * 60;
            let rawSec    = avgSec - offsetSec;
            // Round UP to the nearest whole minute — matches how this is done
            // by hand (e.g. an exact 8:04:09 becomes 8:05, not a truncated 8:04).
            minchaMaarivSec = Math.ceil(rawSec / 60) * 60;
        }
    }

    // מעריב — fixed nightly time.
    let maarivSec = parse24ToSec(maarivWeekday);

    let rows = [];
    rows.push(`<div class="z-row"><span class="z-label">שחרית (יום א')</span><span class="z-time">${shSunSec!=null ? fmtZmanNoSec(secToTimeStr(shSunSec)) : '--:--'}</span></div>`);
    rows.push(`<div class="z-row"><span class="z-label">${shLabel}</span><span class="z-time">${shSec!=null ? fmtZmanNoSec(secToTimeStr(shSec)) : '--:--'}</span></div>`);
    if (earlyMinchaSec != null) {
        rows.push(`<div class="z-row"><span class="z-label">מנחה</span><span class="z-time">${fmtZmanNoSec(secToTimeStr(earlyMinchaSec))}</span></div>`);
    }
    rows.push(`<div class="z-row"><span class="z-label">מנחה-מעריב</span><span class="z-time">${minchaMaarivSec!=null ? fmtZmanNoSec(secToTimeStr(minchaMaarivSec)) : '--:--'}</span></div>`);
    rows.push(`<div class="z-row"><span class="z-label">מעריב</span><span class="z-time">${maarivSec!=null ? fmtZmanNoSec(secToTimeStr(maarivSec)) : '--:--'}</span></div>`);

    let html = '<div class="zemanim-header">זמנים התפילה בימי חול</div>' + rows.join('');
    EL['ZMANIM_TEFILA'].style.flex = rows.length;
    if (html !== lastTefilaHTML) {
        lastTefilaHTML = html;
        EL['ZMANIM_TEFILA'].innerHTML = html;
    }
}

// ── MAIN UI UPDATE ────────────────────────────────────────────────
function updateUI() {
    let now = new Date();
    let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    let cSec = (h*3600) + (m*60) + s;
    let dayW = now.getDay();
    
    let dToday = schedule[getIso(now)]; if (!dToday) return;
    let holidayText = dToday.holidayText || "";

    // RULE 1: Shavuot Flower Border - "שבועות" in Col D
    let isHolidayStayAwake = holidayText.includes("שבועות");
    if (isHolidayStayAwake) {
        document.body.classList.add('shavuot-mode');
    } else {
        document.body.classList.remove('shavuot-mode');
    }

    // RULE 2: Night Mode - 1-5 AM (except Shavuot)
    if (!isHolidayStayAwake && h >= 1 && h < 5) {
        EL['SLEEP_OVERLAY'].style.display = 'block';
        EL['SLEEP_CLOCK'].innerText = (h%12||12) + ":" + String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
        if (s === 0) {
            EL['SLEEP_CLOCK'].style.left = (Math.floor(Math.random()*70)+5) + "vw";
            EL['SLEEP_CLOCK'].style.top  = (Math.floor(Math.random()*80)+5) + "vh";
        }
        return;
    } else { EL['SLEEP_OVERLAY'].style.display = 'none'; }

    const THREE_AM = 10800;
    // RULE 5: Hebrew Date Flip
    // - Chag to chag (today IS Yom Tov, tomorrow IS ALSO Yom Tov — e.g.
    //   שמיני עצרת → שמחת תורה, or day 1 → day 2 of RH/Sukkot): flips
    //   25 min before RT, checked FIRST so it applies regardless of day of
    //   week (a Shabbos-that's-also-Yom-Tov transitioning into the next
    //   Yom Tov day still uses RT, not the Friday candle-lighting rule).
    // - Friday (not otherwise chag-to-chag): flip at candle lighting.
    // - Erev Yom Tov on any other day (today NOT Yom Tov, tomorrow IS):
    //   also flips at candle lighting, same as Erev Shabbos.
    // - Otherwise: flip at 3 AM.
    let tomorrowIsoForFlip = getIso(new Date(now.getTime() + 86400000));
    let tomorrowDataForFlip = schedule[tomorrowIsoForFlip];
    let tomorrowIsYomTovForFlip = tomorrowDataForFlip && tomorrowDataForFlip.yomtov === "Y";
    let todayIsYomTovForFlip = dToday.yomtov === "Y";

    let dIso;
    if (tomorrowIsYomTovForFlip && todayIsYomTovForFlip) {
        // Chag to chag — 25 min before RT
        let rtSecsToday = getSec(dToday.z[10], true);
        dIso = (cSec >= rtSecsToday - 1500) ? getIso(new Date(now.getTime() + 86400000)) : getIso(now);
    } else if (dayW === 5) {
        // Friday: flip at candle lighting
        let candleTime = (dToday.candle || "").trim();
        let candleSecs = candleTime ? getSec(candleTime, false) : 0;
        if (candleSecs < 43200) candleSecs += 43200; // Handle 12-hour format
        dIso = (cSec >= candleSecs && candleSecs > 0) ? getIso(new Date(now.getTime() + 86400000)) : getIso(now);
    } else if (tomorrowIsYomTovForFlip && !todayIsYomTovForFlip) {
        // Erev Yom Tov, any other day of the week: flip at candle lighting
        let candleTime = (dToday.candle || "").trim();
        let candleSecs = candleTime ? getSec(candleTime, false) : 0;
        if (candleSecs < 43200) candleSecs += 43200;
        dIso = (cSec >= candleSecs && candleSecs > 0) ? getIso(new Date(now.getTime() + 86400000)) : getIso(now);
    } else {
        // Ordinary weekday: the Hebrew day itself changes at RT (72 min),
        // not at a fixed 3 AM cutoff — flips forward the evening before,
        // same as every other RT-based boundary already used elsewhere.
        // Replaces the old fixed-3AM fallback, which never flipped forward
        // early and instead just picked an arbitrary dawn-ish cutoff.
        let rtSecsToday = getSec(dToday.z[10], true);
        dIso = (cSec >= rtSecsToday) ? getIso(new Date(now.getTime() + 86400000)) : getIso(now);
    }
    let dDate = schedule[dIso] || dToday;
    currentDDate = dDate; // expose to applyData() and anything else outside updateUI()'s own scope

    // PDF ZMANIM OVERRIDE — looked up once per cycle using dIso (the
    // same date the zmanim list itself is built from). null if no
    // PDFZmanim week covers this date; all override blocks below check
    // this before falling back to existing formula behavior.
    let pdfOverride = findPdfZmanimOverride(dIso);

    let rtSecs = getSec(dToday.z[10], true);
    // RULE 7: Omer Box Flip - RT - 25 min
    let oIso   = (cSec >= rtSecs - 1500) ? getIso(new Date(now.getTime() + 86400000)) : getIso(now);
    let dOmer  = schedule[oIso] || dToday;

    // RULE 4: Day Label Changes to "מוצאי שבת" at Maariv
    let maarivSec = getSec(dToday.z[9], true) + (51 * 60);
    let isMotzMaariv = (dayW === 6 && cSec >= maarivSec) || (dayW === 0 && cSec < 3600);
    let dayLabel = isMotzMaariv ? "מוצאי שבת" : (DAY_MAP[dDate.day] || dDate.day);
    if (EL['DAY_LABEL'].innerText !== dayLabel) {
        EL['DAY_LABEL'].innerText = dayLabel;
        fit(EL['DAY_LABEL'], 5.8);
    }

    if (dIso !== lastDateIso) {
        lastDateIso = dIso;
        EL['DATE_LABEL'].innerText   = dDate.heb;
        EL['PARSHA_LABEL'].innerText = dDate.parsha ? "פרשת " + dDate.parsha : "";
        fit(EL['DATE_LABEL'],   5.0);
        fit(EL['PARSHA_LABEL'], 5.5);
    }

    // ── RULES 8-13: DYNAMIC SORTED ZMANIM ──────────────────────────
    // RULE 8:  Dynamic sorted zmanim
    // RULE 9:  Candle lighting - Friday/Yom Tov only
    // RULE 10: Friday additions (Apr-Sep) - מנחה וקבלת שבת + זרע שמשון
    // RULE 11: Saturday additions - מנחה, שיעור מן הרב, פרקי אבות
    // RULE 12: Maariv - Sat all day + Sun until 1 AM
    // RULE 13: Rabbeinu Tam - always shown
    let candleTime = (dToday.candle || "").trim();
    let civMon     = now.getMonth() + 1;
    let isFriday   = (dayW === 5);
    let isSaturday = (dayW === 6);
    let isMinchaFriSeason = (civMon >= 4 && civMon <= 9);
    let isPirkeySeason    = (civMon >= 4 && civMon <= 9);
    let isYomTov  = (dToday.yomtov === "Y"); // used for zmanim additions; redefined below for status box

    // Each entry: { id, label, timeStr, secVal, style }
    let zRows = [
        { id:'r1',  label:'עלות השחר',       timeStr: dDate.z[0], secVal: getSec(dDate.z[0], false) },
        { id:'r2',  label:'הנחת תפילין',      timeStr: dDate.z[1], secVal: getSec(dDate.z[1], false) },
        { id:'r3',  label:'נץ החמה',          timeStr: dDate.z[2], secVal: getSec(dDate.z[2], false) },
        { id:'r4',  label:'סוף זק"ש מג"א',   timeStr: dDate.z[3], secVal: getSec(dDate.z[3], false) },
        { id:'r5',  label:'סוף זק"ש גר"א',   timeStr: dDate.z[4], secVal: getSec(dDate.z[4], false) },
        { id:'r6',  label:'סוף זמן תפילה',   timeStr: dDate.z[5], secVal: getSec(dDate.z[5], false) },
        { id:'r7',  label:'חצות היום',        timeStr: dDate.z[6], secVal: getSec(dDate.z[6], false)  },
        { id:'r8',  label:'מנחה גדולה',       timeStr: dDate.z[7], secVal: getSec(dDate.z[7], true)  },
        { id:'r9',  label:'פלג המנחה',        timeStr: dDate.z[8], secVal: getSec(dDate.z[8], true)  },
    ];

    // Candle lighting — Friday/Yom Tov only
    // PDF override: display only — candleTime/candleSecs (Shabbos boundary
    // logic used elsewhere) stay on the formula value, untouched.
    if (candleTime !== "" && h !== 0) {
        let displayCandle = (pdfOverride && pdfOverride.candleLighting) ? pdfOverride.candleLighting : candleTime;
        zRows.push({ id:'row_special', label:'הדלקת נרות', timeStr: displayCandle,
            secVal: getCandleSec(displayCandle) });
    }

    // שקיעה
    zRows.push({ id:'r10', label:'שקיעת החמה', timeStr: dDate.z[9], secVal: getSec(dDate.z[9], true) });

    // Friday: מנחה וקבלת שבת + זרע שמשון — skip on Erev Shabbat Yom Tov
    // PDF override: fridayMincha replaces the hardcoded 7:00 PM when present;
    // זרע שמשון stays derived as 20 min before Mincha either way.
    if (isFriday && isMinchaFriSeason && !isYomTov) {
        let friMinchaTime = (pdfOverride && pdfOverride.fridayMincha) ? pdfOverride.fridayMincha : '7:00:00';
        let friMinchaSec  = getSec(friMinchaTime, true);
        let zeraTime      = shiftTime(friMinchaTime, -20);
        zRows.push({ id:'r_fri_mincha', label:'מנחה וקבלת שבת', timeStr: friMinchaTime,
            secVal: friMinchaSec });
        zRows.push({ id:'r_zera', label:'זרע שמשון', timeStr: zeraTime,
            secVal: friMinchaSec - 20*60 });
    }

    // Saturday: שחרית, מנחה, שיעור מן הרב, פרקי אבות — skip on Shabbat Yom Tov
    // PDF override: each of these 4 uses the PDF value directly when present;
    // שחרית has no formula fallback (new row, PDF-only — only shown when override exists).
    if (isSaturday && !isYomTov) {
        if (pdfOverride && pdfOverride.shacharis) {
            zRows.push({ id:'r_shacharis', label:'שחרית', timeStr: pdfOverride.shacharis,
                secVal: getSec(pdfOverride.shacharis, false) });
        }

        let shabMinchaTime = (pdfOverride && pdfOverride.mincha) ? pdfOverride.mincha : shiftTime(dDate.z[9], -28);
        let shiurTime      = (pdfOverride && pdfOverride.shiurMinRav) ? pdfOverride.shiurMinRav : shiftTime(dDate.z[9], -88);
        let shabMinchaSec  = (pdfOverride && pdfOverride.mincha) ? getSec(shabMinchaTime, true) : (getSec(dDate.z[9], true) - 28*60);
        let shiurSec       = (pdfOverride && pdfOverride.shiurMinRav) ? getSec(shiurTime, true) : (getSec(dDate.z[9], true) - 88*60);
        zRows.push({ id:'r_shab_mincha', label:'מנחה',           timeStr: shabMinchaTime, secVal: shabMinchaSec });
        zRows.push({ id:'r_shiur',       label:'שיעור מן הרב',   timeStr: shiurTime,      secVal: shiurSec });
        if (isPirkeySeason) {
            let pirkeiTime = (pdfOverride && pdfOverride.pirkeiAvos) ? pdfOverride.pirkeiAvos : '7:00:00';
            zRows.push({ id:'r_avos', label:'פרקי אבות', timeStr: pirkeiTime, secVal: getSec(pirkeiTime, true) });
        }
    }

    // מעריב — show all of Shabbos day (from Alos Sat through 1AM Sun)
    // PDF override: display only, uses formula derivation when no override exists.
    let alosToday  = getSec(dToday.z[0], false);
    let showMaariv = (dayW === 6) || (dayW === 0 && cSec < 3600);
    if (showMaariv) {
        let maarTime = (pdfOverride && pdfOverride.maariv) ? pdfOverride.maariv : shiftTime(dDate.z[9], 51);
        let maarSec  = (pdfOverride && pdfOverride.maariv) ? getSec(maarTime, true) : (getSec(dDate.z[9], true) + 51*60);
        zRows.push({ id:'r11', label:'מעריב', timeStr: maarTime, secVal: maarSec });
    }

    // זמנים התפילה בימי חול — the always-visible davening box, entirely
    // separate from this sorted list (see renderTefilaBox below). Not
    // day-gated, no live highlighting, rendered independently.
    renderTefilaBox(now, dayW, holidayText, cSec, getSec(dToday.z[9], true) - 1800);

    // רבינו תם — always from the Zemanim sheet now (PDF override removed
    // per request); rtSecs (Shabbos boundary/flip logic used throughout
    // updateUI) was already on the formula value regardless.
    let rtTime = dDate.z[10];
    zRows.push({ id:'r12', label:'רבינו תם', timeStr: rtTime, secVal: getSec(rtTime, true) });

    // Sort all by time
    zRows.sort((a, b) => a.secVal - b.secVal);

    // Proportional split: this box's share of zemanim-col-wrap's height scales
    // with its own row count, so a row here and a row in the always-on
    // זמנים התפילה בימי חול box end up roughly the same height regardless of
    // day (Shabbos has far more rows here than a regular weekday).
    if (EL['ZMANIM_LIST']) EL['ZMANIM_LIST'].style.flex = zRows.length;

    // Find next upcoming zman for highlight
    let nextId = null;
    for (let z of zRows) {
        if (z.secVal > cSec && z.secVal > 0) { nextId = z.id; break; }
    }

    // Render — only rebuild DOM if day changed or highlight changed
    if (dIso !== lastZmanim || nextId !== currentlyHighlightedId) {
        lastZmanim = dIso + '_' + nextId;
        EL['ZMANIM_LIST'].innerHTML = '<div class="zemanim-header">זמני היום</div>' + zRows.map(z => {
            let isActive  = (z.id === nextId);
            let rowStyle  = isActive ? '' : (z.style || '');
            let rowClass  = isActive ? 'z-row active-zman' : 'z-row';
            let lblStyle  = isActive ? '' : (z.labelStyle || '');
            let timeStyle = isActive ? '' : (z.timeStyle || '');
            return `<div class="${rowClass}" id="${z.id}" style="${rowStyle}">
                <span class="z-label" style="${lblStyle}">${z.label}</span>
                <span class="z-time" style="${timeStyle}">${fmtZman(z.timeStr)}</span>
            </div>`;
        }).join('');
        currentlyHighlightedId = nextId;
    }

    let moledText   = dDate.moledDisplay || "";  // Column Y - Molad Display
    let isMoledTime = (cSec >= 28800 && cSec <= 41400); // 8:00 AM – 11:30 AM
    let isShabbat   = (dayW === 6);
    let isMoledDisplay = isMoledTime && isShabbat && moledText !== "";
    // Never show the Molad announcement on-screen anywhere in Tishrei
    // (1-10 Tishrei), regardless of what's in Column Y that day — the
    // underlying data still feeds Kiddush Levana normally via the
    // separate "moled" tab, this only suppresses the Omer-box text.
    if ((dDate.heb || "").includes("תשרי")) {
        let tishreiDayForMoled = extractHebDay(dDate.heb || "");
        if (tishreiDayForMoled >= 1 && tishreiDayForMoled <= 10) isMoledDisplay = false;
    }
    
    let omerKey     = dOmer.omerNum ? String(dOmer.omerNum).trim() : null;
    let summerMsg   = dOmer.clmF || defaultSummerMsg;

    // RULE 15: Omer Box Priority Chain (5 levels)
    // Pills in branding bar: shown during Omer season, hidden otherwise (Daf+Amud move to box)
    const dafPillEl  = document.getElementById('DAF_YOMI');
    const amudPillEl = document.getElementById('AMUD_YOMI');
    const isOmerSeason = !!omerKey;

    if (isHolidayStayAwake) {
        // RULE 3: Shavuot Special Message
        EL['O2'].innerHTML = '';
        EL['O2'].innerText = "🌸 זמן מתן תורתינו 🌸\nא פרייליכען יום טוב שבועות 🌺";
        fitExpand(EL['O2'], 3.5, 8.0);
        if (dafPillEl)  dafPillEl.style.display  = '';
        if (amudPillEl) amudPillEl.style.display  = 'none';
    } else if (isMoledDisplay) {
        EL['O2'].innerHTML = '';
        EL['O2'].innerText = moledText;
        fitExpand(EL['O2'], 2.8, 5.0);
        if (dafPillEl)  dafPillEl.style.display  = '';
        if (amudPillEl) amudPillEl.style.display  = 'none';
    } else if (omerKey) {
        // Omer season — show count, pills visible in branding bar
        EL['O2'].innerHTML = '';
        EL['O2'].innerText = "היום " + (OMER_STRINGS[omerKey] || omerKey + " יום") + " בעומר";
        fitExpand(EL['O2'], 3.2, 8.0);
        if (dafPillEl)  dafPillEl.style.display  = '';
        if (amudPillEl) amudPillEl.style.display  = '';
    } else {
        // Non-Omer season — show Daf + Amud in the box, hide pills from branding bar
        const daf  = getTodayDafYomi();
        const amud = getTodayAmudYomi();
        if (daf && amud) {
            EL['O2'].innerHTML = `
                <div class="omer-daf-amud">
                    <span class="da-label">דף היומי</span>
                    <span class="da-text">${daf}</span>
                    <div class="da-divider"></div>
                    <span class="da-label">עמוד היומי</span>
                    <span class="da-text">${amud.tractate} ${amud.daf} ${amud.side}</span>
                </div>`;
        } else {
            EL['O2'].innerHTML = '';
            EL['O2'].innerText = summerMsg;
            fitExpand(EL['O2'], 3.2, 8.0);
        }
        if (dafPillEl)  dafPillEl.style.display  = 'none';
        if (amudPillEl) amudPillEl.style.display  = 'none';
    }

    // RULE 6: Status Box Flip - Sat after RT, Erev at candlelighting, others at 3 AM
    // FIX (May 2026): isMotz now extends through Sunday 3 AM to prevent snap-back to
    // Saturday data at midnight. statusIso also corrected for that window.
    let isMotz   = (dayW===6 && cSec >= rtSecs) || (dayW===0 && cSec < THREE_AM);
    let statusIso;
    if (dayW===0 && cSec < THREE_AM) {
        // Sunday before 3 AM — still Motzei Shabbat, point to Sunday's data
        statusIso = getIso(now);
    } else {
        statusIso = dIso; // All other cases use same flip as dIso
    }
    let statusDate = schedule[statusIso] || dToday;
    let hText = (statusDate.holidayText || "").trim();
    let candleSecs = getCandleSec(candleTime);
    let isShab   = (dayW===5 && candleTime && cSec >= candleSecs) || (dayW===6 && cSec < rtSecs);
    let isYomTovStatus = (statusDate.yomtov === "Y");
    let isKodesh = isShab || isYomTovStatus;
    updateP1Image(isKodesh);
    let tR = (schedule[statusIso] ? (schedule[statusIso].tachReason || "") : (dDate.tachReason || "")).trim();
    if (!tR) tR = (dToday.tachReason || "").trim(); // fallback to today's tachanun reason
    // אסרו חג always means "no Tachanun" — no sheet entry needed at all.
    // Set tR to the explicit no-Tachanun text (not "אסרו חג" itself) so it
    // shows as a distinct, informative sub-line under the אסרו חג head,
    // rather than duplicating the head text and getting suppressed by the
    // anti-duplicate guard below.
    if (!tR && hText.includes("אסרו חג")) tR = "אין אומרים תחנון";
    // Hardcoded no-Tachanun days (item 5) — independent of the sheet.
    // Skipped during Chol Hamoed since its own name is already the head.
    let isCholHamoedNow = hText.includes("חול המועד") || (dToday.holidayText || "").includes("חול המועד");
    if (!tR && !isCholHamoedNow && isChesedVemesNoTachanunDay(dDate.heb || "", statusIso)) {
        tR = "אין אומרים תחנון";
    }
    // Mincha-eve extension (Chesed V'Emes says Tachanun at Mincha, unlike
    // Bayswater): the evening before a day with no Tachanun — either one of
    // the hardcoded no-Tachanun days, OR Rosh Chodesh (checked separately
    // via tomorrow's holidayText, since RC isn't part of the hardcoded
    // list) — Tachanun is also not said at Mincha tonight, starting 30 min
    // before Shkiah.
    if (!tR) {
        // FIX: "tomorrow" here must be relative to the REAL civil date
        // (now), not dIso — see the identical fix + explanation in the RC
        // block below, same root cause.
        let tomorrowIso = getIso(new Date(now.getTime() + 86400000));
        let tomorrowHeb = (schedule[tomorrowIso] || {}).heb || "";
        let tomorrowIsRC = ((schedule[tomorrowIso] || {}).holidayText || "").includes("ראש חודש");
        if (isChesedVemesNoTachanunDay(tomorrowHeb, tomorrowIso) || tomorrowIsRC) {
            let shkiaSec = getSec(dToday.z[9], true);
            if (cSec >= shkiaSec - 1800) tR = "אין אומרים תחנון"; // 30 min before Shkiah
        }
    }

    // RULE 17: Geshem Season - Oct-Apr with edge refinements
    // RULE 18: Tal Umatar Season - Dec 4 - Pesach, replaces ותן ברכה
    let chatzotSec = getSec(dDate.z[6], false);
    let hebStr     = dDate.heb || "";
    let isPesach1  = hebStr.includes("ניסן") && extractHebDay(hebStr) === 15;
    let pastChatzot = (cSec >= chatzotSec && chatzotSec > 0);

    let civMonth = now.getMonth() + 1;
    let civDay   = now.getDate();
    let civYear  = now.getFullYear();

    function isLeapYear(y) { return (y%4===0 && y%100!==0) || y%400===0; }
    let talUmatarDay = isLeapYear(civYear - 1) ? 5 : 4;

    let isTalUmatar = false;
    if (civMonth === 12 && civDay >= talUmatarDay) isTalUmatar = true;
    else if (civMonth === 1 || civMonth === 2) isTalUmatar = true;
    else if (civMonth === 3) isTalUmatar = true;
    else if (civMonth === 4) isTalUmatar = true;
    if (isPesach1 && pastChatzot) isTalUmatar = false;
    if (civMonth >= 5 && civMonth <= 11) isTalUmatar = false;

    let head = "", sub = "", cls = "gold-box";
    // isPastRT: cSec resets to a small number right after midnight, while
    // rtSecs is last night's evening RT time — a naive cSec >= rtSecs check
    // would wrongly stay "before RT" for the rest of the night. RT always
    // happens well before midnight in practice, so once we're in the
    // midnight-to-3AM continuation window (same window dIso/dDate use for
    // the date flip), we're unconditionally already past it.
    let isPastRT  = (cSec >= rtSecs) || (cSec < THREE_AM);
    // Tachanun-specific: disappears 25 min before RT, not at RT itself —
    // matches the Rosh Chodesh cutoff (rochCutoff) and Omer flip, which
    // already both use this same 25-min offset. Only the Tachanun line uses
    // this — Motzei Yom Tov and general holiday text stay on exact-RT below.
    let isPastRTMinus25 = (cSec >= rtSecs - 1500) || (cSec < THREE_AM);

    // ותן ברכה/ותן טל ומטר is a Shemoneh Esrei insert, unrelated to
    // Tachanun — applies every weekday regardless of what else the box
    // shows. Set true inside the weekday branch below whenever something
    // other than the plain default itself takes over the head/sub slots,
    // so it can still be added back as an extra small line.
    let showDefaultBlessingExtra = false;

    // Friday-is-Rosh-Chodesh handling (checked before isShab so it can
    // override the normal Erev-Shabbos flip):
    // - fridayIsRC: is TODAY (civil Friday, via dToday — unaffected by the
    //   candle-lighting flip) Rosh Chodesh?
    // - Case 1 (fridayIsRC true, Shabbos itself NOT RC): keep showing the
    //   RC display straight through candle lighting, only switching to
    //   plain שבת קודש within 25 min of RT (same boundary the weekday RC
    //   logic already uses).
    // - Cases 2/3 (Shabbos IS RC) are handled inside the existing isShab
    //   branch below, using fridayIsRC to distinguish a 2-day RC spanning
    //   Fri+Sat (switch immediately at candle lighting) from a single-day
    //   RC landing on Shabbos alone (delay 45 min after candle lighting).
    let fridayIsRC = (dayW === 5) && (dToday.holidayText || "").includes("ראש חודש");
    // Look up Saturday's OWN holidayText directly (not hText, which is
    // flip-state-dependent and would still reflect Friday's own data if
    // checked before candle lighting has passed) — using now.getTime()
    // arithmetic (a real Date object, not a string) so this is safe
    // regardless of timezone.
    let saturdayDataForRC = fridayIsRC ? schedule[getIso(new Date(now.getTime() + 86400000))] : null;
    let saturdayIsRC = saturdayDataForRC && (saturdayDataForRC.holidayText || "").includes("ראש חודש");
    let rochCutoffFriday = rtSecs - 1500;
    let isCase1RCContinuation = fridayIsRC && !saturdayIsRC && cSec < rochCutoffFriday;

    // RULE 14: Status Box Priority Chain (8 levels)
    if (isCase1RCContinuation) {
        head = (dToday.holidayText || "ראש חודש").trim();
        // הלל only Alos-through-Plag (same rule as שופר) — before Alos this
        // is still technically last night; יעלה ויבא applies regardless.
        let isHallelWindowFri = cSec >= getSec(dToday.z[0], false) && cSec < getSec(dToday.z[8], true);
        sub = isHallelWindowFri ? "הלל, יעלה ויבא" : "יעלה ויבא";
        cls = "teal-box";
    } else if (isShab) {
        if (isYomTovStatus && hText) {
            head = hText;
            sub = "";
            cls = "teal-box";
        } else if (hText && hText.includes("ראש חודש") && !hText.includes("מברכים")) {
            // Shabbos is Rosh Chodesh. If Friday (today, civil) was ALSO
            // RC, switch immediately at candle lighting (2-day RC spanning
            // Fri+Sat). If Friday was NOT RC (a single-day RC landing on
            // Shabbos alone), delay 45 min after candle lighting — show
            // plain שבת קודש for those first 45 minutes.
            let readyForRCDisplay = fridayIsRC || (cSec >= candleSecs + 2700); // 45 min
            if (readyForRCDisplay) {
                head = "שבת ראש חודש";
                // הלל only Alos-through-Plag (same rule as everywhere else) —
                // יעלה ויבא/אתה יצרת apply regardless of time. dDate here is
                // already Saturday's own (flipped) data, matching hText's source.
                let isHallelWindowShabRC = cSec >= getSec(dDate.z[0], false) && cSec < getSec(dDate.z[8], true);
                sub = isHallelWindowShabRC ? "הלל, יעלה ויבא, אתה יצרת" : "יעלה ויבא, אתה יצרת";
                cls = "teal-box";
            } else {
                head = "שבת קודש";
                sub = "";
                cls = "gold-box";
            }
        } else if (hText && hText.includes("מברכים")) {
            head = "שבת מברכים";
            let rcDays = [];
            let rcText = "";
            for (let ahead = 1; ahead <= 8; ahead++) {
                let aheadDate = new Date(now.getTime() + ahead * 86400000);
                let aheadIso = getIso(aheadDate);
                let aheadDay = schedule[aheadIso];
                if (aheadDay && (aheadDay.holidayText || "").includes("ראש חודש")) {
                    let dayName = DAY_NAMES[aheadDate.getDay()];
                    if (dayName && !rcDays.includes(dayName)) rcDays.push(dayName);
                    if (!rcText) rcText = aheadDay.holidayText;
                }
            }
            if (rcDays.length > 0) {
                if (rcDays.length === 1) {
                    sub = rcText + " │ " + rcDays[0];
                } else if (rcDays.length === 2) {
                    sub = rcText + " │ " + rcDays[0] + " │ ו" + rcDays[1];
                } else {
                    sub = rcText + " │ " + rcDays.slice(0, -1).join(", ") + " │ ו" + rcDays[rcDays.length - 1];
                }
            }
            cls = "teal-box";
        } else if (hText !== "") {
            head = hText;
            sub = "";
            cls = "teal-box";
        } else {
            head = "שבת קודש";
            sub = "";
            cls = "gold-box";
        }
    } else if (isMotz) {
        // RULE 22: "ותודיענו" - Only when Motzei Shabbat + Yom Tov tomorrow
        // "Tomorrow" needs its OWN base here — separate from dIso — since
        // dIso can already be flipped ahead by the chag-to-chag rule (e.g.
        // Shabbos-that's-also-Shmini-Atzeret past RT already points dIso at
        // Simchat Torah), which would make "tomorrow" wrongly skip past the
        // actual next day. Only correct for the Sunday-before-3AM overlap
        // (still conceptually "Motzei Shabbat", so treat as if it's still
        // Saturday) — the plain civil day otherwise.
        let motzBaseIso = (dayW === 0 && cSec < THREE_AM) ? getIso(new Date(now.getTime() - 86400000)) : getIso(now);
        let dNextDay = schedule[getIso(new Date(new Date(motzBaseIso + 'T00:00:00').getTime() + 86400000))];
        let nextDayIsYomTov = dNextDay && (dNextDay.yomtov === "Y");
        
        if (nextDayIsYomTov && hText) {
            // Tomorrow is Yom Tov — show holiday with ותודיענו. No default
            // blessing here since tomorrow's davening is Yom Tov, not weekday.
            head = hText; sub = "ותודיענו"; cls = "teal-box";
        } else if (hText !== "" && !hText.trim().startsWith("שבת")) {
            // Any "שבת X" label (מברכים, שובה, חזון, נחמו, הגדול, ראש חודש,
            // etc.) is a Shabbos-specific name that doesn't carry over once
            // Shabbos has ended, so it's excluded here and falls through to
            // plain "מוצאי שבת" below — unlike other holiday text (e.g.
            // סוכות) which does meaningfully continue into the evening.
            if (hText.includes("ראש חודש")) {
                head = hText; sub = "הלל, יעלה ויבא"; cls = "teal-box";
            } else {
                head = hText; sub = "אתה חוננתנו"; cls = "teal-box";
            }
            showDefaultBlessingExtra = true;
        } else {
            head = "מוצאי שבת"; sub = "אתה חוננתנו";
            showDefaultBlessingExtra = true;
        }
    } else if (isYomTovStatus) {
        let dNextDay = schedule[getIso(new Date(new Date(dIso + 'T00:00:00').getTime() + 86400000))];
        let nextDayIsYomTov = dNextDay && (dNextDay.yomtov === "Y");
        
        if (!nextDayIsYomTov && isPastRT) {
            head = "מוצאי יום טוב"; sub = "אתה חוננתנו"; cls = "gold-box";
            showDefaultBlessingExtra = true;
        } else {
            // No sub-text on Yom Tov itself — Tachanun is never relevant
            // (it's simply never said), so any tR value (e.g. from the
            // Mincha-eve extension seeing tomorrow needs it) is redundant
            // noise here and gets dropped rather than shown.
            head = hText || "יום טוב"; sub = ""; cls = "teal-box";
        }
    } else {
        // RULE 14 — Rosh Chodesh: starts RT-25min the evening before, ends RT-25min on last day
        let rochCutoff = rtSecs - 1500; // 25 min before RT
        // hText-based check (covers normal daytime + after 3AM)
        let todayIsRC  = hText.includes("ראש חודש");
        // dToday-based check (covers midnight-to-3AM when dIso still points to yesterday
        // but the civil date has already flipped to RC day)
        let civilTodayIsRC = (dToday.holidayText || "").includes("ראש חודש");
        // Either check firing means we're on RC day
        let onRCDay = todayIsRC || civilTodayIsRC;
        // Use the right text source for head display
        let rcHeadText = todayIsRC ? hText : (dToday.holidayText || "ראש חודש");

        // Check if tomorrow is Rosh Chodesh (handles erev RC and 2-day RC)
        // FIX: must be relative to the REAL civil date (now), not dIso.
        // Before item 3's fix, dIso never flipped forward early on
        // ordinary days, so dIso+1 was always safe. Now that dIso DOES
        // flip forward at RT, using dIso+1 here double-counted the flip:
        // once RT passed, dIso already equaled tomorrow, so dIso+1
        // overshot to the day after — breaking isErevRC for the entire
        // RT-to-midnight window every single night. Using now+1 always
        // means "the actual next calendar day," regardless of whether
        // dIso has already flipped, which also makes this self-sufficient
        // for the whole evening without needing to hand off to anything
        // else once RT passes.
        let dTomorrow    = schedule[getIso(new Date(now.getTime() + 86400000))];
        let tomorrowIsRC = dTomorrow && (dTomorrow.holidayText || "").includes("ראש חודש");
        // Dropped the old "&& !onRCDay" guard: today-is-RC AND tomorrow-is-RC
        // can only mean today is day 1 of a 2-day RC (RC is never 3+ days),
        // so this correctly continues the display into day 1's evening
        // instead of falling back to the default message.
        let isErevRC     = tomorrowIsRC && cSec >= rochCutoff;

        // General nightfall-trigger — covers Purim + all 8 nights of
        // Chanukah (see NIGHTFALL_TRIGGER_MATCHERS above for the full list
        // and why RC stays separate).
        // Column D (holidayText) itself is the trigger — see the
        // NIGHTFALL-TRIGGER comment above isChesedVemesNoTachanunDay for
        // why this is data-driven rather than a hardcoded date list.
        // Excludes Yom Tov (own flip already correct) and RC (handled above).
        let isErevNightfallHoliday = dTomorrow && (dTomorrow.holidayText || "").trim() !== ""
            && dTomorrow.yomtov !== "Y" && !tomorrowIsRC && cSec >= rochCutoff;

        // ותן ברכה/ותן טל ומטר is a Shemoneh Esrei insert, unrelated to
        // Tachanun — it applies every weekday regardless of what else the
        // box is showing. Track when a branch OTHER than the plain default
        // fires, so it can still be shown as an extra small line below.
        if (isErevRC) {
            // Entirely a nighttime window by construction (25 min before RT
            // onward) — הלל is never said at night, so drop it unconditionally.
            // יעלה ויבא applies regardless of time, so it stays.
            head = dTomorrow.holidayText; sub = "יעלה ויבא"; cls = "teal-box";
            showDefaultBlessingExtra = true;
        } else if (isErevNightfallHoliday) {
            // Blank sub for this evening-before window on both Purim and
            // Chanukah — Purim/Shushan Purim never show Tachanun text at
            // all (see below); Chanukah's own "אין אומרים תחנון" still
            // shows normally once the day itself actually arrives.
            head = dTomorrow.holidayText; sub = ""; cls = "teal-box";
            showDefaultBlessingExtra = true;
        } else if (onRCDay && cSec < rochCutoff) {
            // הלל only Alos-through-Plag (same rule as שופר) — יעלה ויבא
            // still applies the whole day, including the evening hours
            // after Plag through rochCutoff.
            let isHallelWindow = cSec >= getSec(dToday.z[0], false) && cSec < getSec(dToday.z[8], true);
            head = rcHeadText; sub = isHallelWindow ? "הלל, יעלה ויבא" : "יעלה ויבא"; cls = "teal-box";
            showDefaultBlessingExtra = true;
        } else if (hText !== "" && !isPastRT && !onRCDay) {
            // Other holiday text before RT. Guard against tR happening to
            // equal hText itself (e.g. אסרו חג, where both the holiday name
            // and the Tachanun-reason default resolve to the same string).
            // Purim/Shushan Purim also blank the sub — same no-Tachanun-
            // text-shown rule as isErevNightfallHoliday above.
            head = hText;
            sub = (tR === hText || hText.includes("פורים")) ? "" : tR;
            cls = "teal-box";
            showDefaultBlessingExtra = true;
        } else if (tR !== "" && !isPastRTMinus25) {
            // Tachanun override — disappears 25 min before RT. If tR is
            // just the generic fallback (matched in the Reason tab but
            // Column B was blank), don't repeat the same text as a sub-line.
            head = "אין אומרים תחנון";
            sub = (tR === "אין אומרים תחנון") ? "" : tR;
            cls = "teal-box";
            showDefaultBlessingExtra = true;
        } else {
            // Default
            let dYesterday = schedule[getIso(new Date(now.getTime() - 86400000))];
            let yesterdayWasYomTov = dYesterday && (dYesterday.yomtov === "Y");
            let alSec = getSec(dToday.z[0], false);
            if (yesterdayWasYomTov && cSec < alSec) {
                head = "מוצאי יום טוב"; sub = "אתה חוננתנו"; cls = "gold-box";
                showDefaultBlessingExtra = true;
            } else {
                head = isTalUmatar ? "ותן טל ומטר" : "ותן ברכה";
            }
        }
    }

    // RULE 16: Kiddush Levana - 3-15 days after Molad, NOT Shabbat/Fri/9 Days
    // Custom timer: Drops the Shabbat blocker 25 minutes (1500 seconds) before RT
    let isShabForKL = (dayW===5 && candleTime && cSec >= candleSecs) || (dayW===6 && cSec < (rtSecs - 1500));
    let showKL = getKiddushLevana(now, dDate.heb || "", isShabForKL, hText, dayW, cSec, getSec(dToday.z[0], false), getSec(dDate.z[9], true));
    let klLine = showKL ? `<span id="status-kl">קידוש לבנה</span>` : "";

    // Elul season — stacks as extra pills alongside whatever the box is
    // already showing, never replacing it. Independent of the priority
    // chain above; each has its own active/inactive condition.
    let todayIsoForSeason = getIso(now);
    let seasonPills = [];
    if (isLedavidActive(todayIsoForSeason, cSec)) seasonPills.push("לדוד ה' אורי");
    if (isShofarActive(todayIsoForSeason, cSec, isShab)) seasonPills.push("שופר");
    if (isSelichotActive(todayIsoForSeason, cSec, isShab, isYomTovStatus)) seasonPills.push("סליחות");
    if (isChanukatHabayitActive(todayIsoForSeason, cSec, isShab)) seasonPills.push("מזמור שיר חנוכת הבית");
    let hoshanaText = getHoshanaText(todayIsoForSeason, cSec, getSec(dToday.z[0], false), getSec(dToday.z[7], true));
    if (hoshanaText) seasonPills.push(hoshanaText);
    let alHanissimText = getAlHanissimText(todayIsoForSeason, cSec, 1500); // Chesed V'Emes: 25 min before RT
    if (alHanissimText) seasonPills.push(alHanissimText);
    // עשי"ת — first night of Rosh Hashana through the end of Yom Kippur.
    // Uses statusIso (the flipped logical day), not todayIsoForSeason —
    // RH's own Yom-Tov flip already correctly shows RH starting the
    // evening before, and YK's own exit (RT-based, see the dIso
    // else-branch) ends this range right at YK's own RT — no separate
    // evening-trigger needed for either boundary. המלך הקדוש every day of
    // the period, including Shabbos/Yom Tov; המלך המשפט weekdays only.
    let inAseresYemeiTeshuva = roshHashanahIso && yomKippurIso && statusIso >= roshHashanahIso && statusIso <= yomKippurIso;
    if (inAseresYemeiTeshuva) seasonPills.push("המלך הקדוש");
    if (inAseresYemeiTeshuva && !isShab && !isYomTovStatus) seasonPills.push("המלך המשפט");
    let seasonLine = seasonPills.length
        ? `<div class="season-line">${seasonPills.map(p => `<span class="season-pill">${p}</span>`).join('')}</div>`
        : "";

    // מוריד הגשם — always visible (every day, Shabbos/Yom Tov included),
    // independent of everything else the box shows. Ashkenaz custom: no
    // מוריד הטל substitute during the summer months, so this stays blank then.
    let geshemTalText = "";
    if (isGeshemActive(todayIsoForSeason, cSec)) geshemTalText = "מוריד הגשם";

    // Priority: מוריד הגשם is promoted (large, on top, replacing the head)
    // only when paired with the plain default (ותן ברכה/ותן טל ומטר) — the
    // default text then drops to a small line right below it. Paired with
    // anything specific (holiday text, Tachanun reason, אסרו חג, חול המועד,
    // שבת מברכים, etc.) it stays demoted at the bottom of the box instead,
    // small, so the specific content keeps priority on top.
    let isPlainDefaultHead = (head === "ותן טל ומטר" || head === "ותן ברכה");
    let geshemPromoted = isPlainDefaultHead && !!geshemTalText;
    let displayHead = geshemPromoted ? geshemTalText : head;
    let demotedDefaultLine = geshemPromoted ? `<span id="status-sub">${head}</span>` : "";

    // When both מוריד הגשם/הטל and ותן ברכה/ותן טל ומטר would end up
    // demoted at the bottom, combine them onto ONE shared line instead of
    // two separate ones — keeps the box from growing past 4-5 lines when
    // something specific is also showing up top (holiday text, Tachanun,
    // KL, season pills, etc.).
    let defaultBlessingText = isTalUmatar ? "ותן טל ומטר" : "ותן ברכה";
    let demotedGeshemLine = "", defaultBlessingLine = "";
    if (!geshemPromoted && geshemTalText && showDefaultBlessingExtra) {
        demotedGeshemLine = `<span class="geshem-tal-text geshem-tal-demoted">${geshemTalText}<span class="mid-divider">│</span>${defaultBlessingText}</span>`;
    } else if (!geshemPromoted && geshemTalText) {
        demotedGeshemLine = `<span class="geshem-tal-text geshem-tal-demoted">${geshemTalText}</span>`;
    } else if (showDefaultBlessingExtra) {
        defaultBlessingLine = `<span class="default-blessing-demoted">${defaultBlessingText}</span>`;
    }

    // Tzidkatcha — Shabbat Mincha only, from Mincha Gedolah onward; turns
    // off automatically at Motzei Shabbos since isShab itself goes false
    // then. Additive, same as the other demoted lines — never replaces
    // anything else the box is showing.
    let tzidkatchaLine = "";
    if (isShab && cSec >= getSec(dToday.z[7], true)) {
        let tomorrowIsoTz = getIso(new Date(now.getTime() + 86400000));
        let tomorrowEntryTz = schedule[tomorrowIsoTz] || {};
        if (isTzidkatchaOmittedShabbat(statusDate.heb || "", statusDate.holidayText || "", tomorrowEntryTz.heb || "", tomorrowEntryTz.holidayText || "", statusIso)) {
            tzidkatchaLine = `<span class="default-blessing-demoted teal-accent">אין אומרים צדקתך</span>`;
        }
    }

    // Build the box as a list of present blocks, joined with a thin divider
    // between each — so whether it's 2 texts (head+sub) or 3 (head+sub+pills),
    // people can tell at a glance they're separate pieces of information.
    // חנוכה is highlighted in teal wherever it shows up in the head — this
    // is a single centralized replace rather than touching every place
    // `head`/displayHead gets built, so it catches all of them uniformly.
    let displayHeadColored = displayHead.replace(/חנוכה/g, '<span class="teal-accent">חנוכה</span>');
    // When geshem/tal is promoted to the headline (the common "מוריד הטל /
    // ותן ברכה" pairing), force it black — matches the demoted version's
    // existing color (.geshem-tal-text) rather than inheriting whatever
    // color the box theme happens to use. The paired "ותן ברכה" line is
    // already black via #status-sub's own CSS; this makes the head half
    // match it too.
    if (geshemPromoted) {
        displayHeadColored = `<span class="force-black">${displayHeadColored}</span>`;
    }

    // Once the box has more than 3 blocks, merge head with whichever
    // "second line" text is actually present — either `sub`, OR
    // `demotedDefaultLine`'s plain text (the geshem-promoted case, e.g.
    // "מוריד הטל" / "ותן ברכה" — these two are mutually exclusive, never
    // both set at once). Missing the demotedDefaultLine case here was a
    // real bug: it's the MORE common of the two on ordinary days, and
    // exactly the pairing the original request was based on.
    let secondLineText = sub || (demotedDefaultLine ? head : "");
    let wouldBeCount = 1; // head
    if (secondLineText) wouldBeCount++;
    if (klLine) wouldBeCount++;
    if (seasonLine) wouldBeCount++;
    if (demotedGeshemLine) wouldBeCount++;
    if (defaultBlessingLine) wouldBeCount++;
    if (tzidkatchaLine) wouldBeCount++;
    let mergeHeadSub = wouldBeCount > 3 && !!secondLineText;

    let statusBlocks = [];
    if (mergeHeadSub) {
        let secondLineColored = geshemPromoted ? `<span class="force-black">${secondLineText}</span>` : secondLineText;
        statusBlocks.push(`<span class="head-sub-merged">${displayHeadColored}<span class="mid-divider">│</span>${secondLineColored}</span>`);
    } else {
        statusBlocks.push(`<span id="status-head">${displayHeadColored}</span>`);
        if (demotedDefaultLine) statusBlocks.push(demotedDefaultLine);
        if (sub) statusBlocks.push(`<span id="status-sub">${sub}</span>`);
    }
    if (klLine) statusBlocks.push(klLine);
    if (seasonLine) statusBlocks.push(seasonLine);
    if (demotedGeshemLine) statusBlocks.push(demotedGeshemLine);
    if (defaultBlessingLine) statusBlocks.push(defaultBlessingLine);
    if (tzidkatchaLine) statusBlocks.push(tzidkatchaLine);
    let textSep = '<div class="text-sep"></div>';
    // Always centered — fitStatusBoxToFill handles making everything fill
    // the space, so the container itself just centers the block as a whole.
    let sH = `<div class="message-box ${cls}">${statusBlocks.join(textSep)}</div>`;
    if (sH !== currentStatusHTML) {
        EL['LEFT_MSG'].innerHTML = sH; currentStatusHTML = sH;
        let msgBoxEl = EL['LEFT_MSG'].querySelector('.message-box');
        let visualRowCount = mergeHeadSub ? wouldBeCount - 1 : wouldBeCount;
        if (msgBoxEl) fitStatusBoxToFill(msgBoxEl, visualRowCount);
    }
}

// ── DATA LOAD ─────────────────────────────────────────────────────
function loadData() {
    // Local file detection - skip network calls if running from file://
    if (location.protocol === 'file:') {
        console.log("LOCAL TEST MODE: Skipping Google Sheets fetch. Using cache only.");
        try { 
            let c = localStorage.getItem('chesed_cache'); 
            if (c) applyData(JSON.parse(c)); 
        } catch(e) {}
        return;
    }
    
    // Don't block - load async in background with SHORT timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 7000);
    
    fetch(SCRIPT_URL + "?cb=" + new Date().getTime(), { signal: controller.signal })
    .then(r => r.json())
    .then(d => {
        clearTimeout(timeoutId);
        if (d && d.schedule) {
            try { localStorage.setItem('chesed_cache', JSON.stringify({ data: d, savedAt: Date.now() })); } catch(e) {}
            applyData(d);
        }
    })
    .catch(err => {
        clearTimeout(timeoutId);
    });
}

function applyData(d) {
    schedule         = d.schedule;
    computeSeasonDates();
    defaultSummerMsg = d.defaultMsg || "";
    tefilaOverride   = d.tefilaOverride || "";
    pdfZmanimList    = d.pdfZmanimList || [];
    shacharisSunday      = d.shacharisSunday      || "07:30";
    shacharisWeekday     = d.shacharisWeekday     || "06:30";
    shacharisRoshChodesh = d.shacharisRoshChodesh || "06:20";
    shacharisCholHamoed  = d.shacharisCholHamoed  || "06:20";
    minchaEarlyEnabled   = d.minchaEarlyEnabled !== false;
    minchaOffsetMinutes  = (d.minchaOffsetMinutes !== undefined && d.minchaOffsetMinutes !== "") ? d.minchaOffsetMinutes : 10;
    maarivWeekday        = d.maarivWeekday        || "21:45";
    shacharisOverride    = d.shacharisOverride    || "";
    minchaMaarivOverride = d.minchaMaarivOverride || "";

    // RULE 19: Rabbi's Corner — only re-renders + re-sizes when text actually changes
    const rabbiEl   = document.getElementById('RABBI');
    const headerEl  = document.getElementById('RABBI-HEADER');
    if (rabbiEl && headerEl) {
        const rabbiBody = rabbiEl.parentElement;
        if (tefilaOverride) {
            const isDvarTorah = tefilaOverride.includes("פרשת");
            if (isDvarTorah) {
                const lines      = tefilaOverride.split("\n");
                const parshaLine = lines.find(l => l.includes("פרשת")) || "";
                const parshaName = parshaLine.trim();
                const bodyText   = lines.filter(l => !l.includes("פרשת")).join("\n").trim();
                rabbiBody.classList.add("dvar-torah");
                if (bodyText !== lastRabbiText) {
                    lastRabbiText = bodyText;
                    rabbiEl.innerText  = bodyText;
                    headerEl.innerText = "דבר תורה · " + parshaName;
                    rabbiEl.style.fontSize = "";  // clear any previous size
                    setTimeout(() => fitExpand(rabbiEl, 3.5, 5.5), 200);
                }
            } else {
                rabbiBody.classList.remove("dvar-torah");
                if (tefilaOverride !== lastRabbiText) {
                    lastRabbiText = tefilaOverride;
                    rabbiEl.innerText  = tefilaOverride.trim();
                    headerEl.innerText = "הלכה יומית";
                    rabbiEl.style.fontSize = "";
                    setTimeout(() => fitExpand(rabbiEl, 3.5, 5.5), 200);
                }
            }
        } else {
            if (lastRabbiText !== "") {
                lastRabbiText = "";
                rabbiEl.innerText  = "";
                headerEl.innerText = "הלכה יומית";
                rabbiBody.classList.remove("dvar-torah");
            }
        }
    }

    // ── IMAGE ROTATION SETUP ──────────────────────────────────────
    p1Images      = d.p1List      || [];
    activeImageId = d.activeImageId || "";
    shabbosPics   = d.shabbosPics || (d.shabbosPic ? [d.shabbosPic] : []);
    shabbosRotationEnabled = !!d.shabbosRotationEnabled;
    p1Rotation    = d.p1Rotation !== false;
    imageExpiryMap = d.imageExpiryMap || {};
    resolvedFallbackId = d.imageFallbackId || DEFAULT_FALLBACK_IMAGE_ID;

    // Handle image expiry — if expired, override activeImageId with fallback
    const fallbackId = resolvedFallbackId;
    if (d.imageExpiry) {
        const expiry = new Date(String(d.imageExpiry).replace(' ', 'T'));
        if (!isNaN(expiry.getTime()) && new Date() > expiry) {
            // Image expired — inject fallback as the only image to show
            p1Images = fallbackId ? [fallbackId] : [];
            activeImageId = fallbackId;
            p1Rotation = false; // show single fallback, no rotation
        }
    }
    // If no images at all, use fallback
    if (p1Images.length === 0 && fallbackId) {
        p1Images = [fallbackId];
        activeImageId = fallbackId;
    }

    // Only touch the timer if not currently in Shabbos freeze
    if (!isShabbosImageActive) {
        if (!p1Rotation || p1Images.length === 1) {
            if (p1RotateTimer) { clearInterval(p1RotateTimer); p1RotateTimer = null; }
            rotateP1();
        } else if (p1Images.length > 0 && !p1RotateTimer) {
            rotateP1();
            p1RotateTimer = setInterval(rotateP1, 14000);
        }
    }

    // ── ANNOUNCEMENT with expiry check ────────────────────────────
    const now = new Date();
    let annText = d.announcements || "";
    if (annText && d.annExpiry) {
        const annExpiry = new Date(d.annExpiry);
        if (!isNaN(annExpiry.getTime()) && now > annExpiry) {
            annText = d.annDefault || ""; // expired — use default standing announcement
        }
    }
    if (!annText) annText = d.annDefault || ""; // empty — always fall back to default
    EL['ANN'].innerText = annText; fit(EL['ANN'], 4.8);

    // FIX: was using schedule[getIso(new Date())] — the plain unflipped
    // civil date, which only advances at civil midnight. dDate is the
    // same RT-aware flipped date already driving the head/status box
    // correctly, matching the backend's own RT-based donor-row fix.
    // FIX: was `dDate.heb` — dDate is a LOCAL variable inside updateUI(),
    // not in scope here inside applyData() at all. That was a hard
    // ReferenceError that threw immediately and halted the rest of this
    // function — donor boxes never got past their initial "טוען..."
    // placeholder because renderDonors() below never ran. currentDDate is
    // the same object, exposed globally by updateUI() each time it runs.
    // Falls back to "" safely if applyData() happens to run before
    // updateUI() ever has (first load) — momentarily shows no month
    // suffix rather than crashing, self-corrects within a second.
    let hebMonth = getHebMonth((currentDDate && currentDDate.heb) || "");
    renderDonors('NER_BODY',    'NER_TITLE',    d.nerDonors    || [], hebMonth);
    renderDonors('COFFEE_BODY', 'COFFEE_TITLE', d.coffeeDonors || [], hebMonth);

    moladList = [];
    if (d.moladList && Array.isArray(d.moladList)) {
        for (let entry of d.moladList) { let p = parseMoladEntry(entry); if (p) moladList.push(p); }
    }
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
  }
}
