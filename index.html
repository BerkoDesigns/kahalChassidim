<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=0.25, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
<title>קהל חסד ואמת – Master Board</title>
<script>
// Chrome-compatible test panel loader — visiting the board with ?test=1
// (or #test=1) appended auto-loads mobile_date_tester.js. Chrome on
// Android blocks javascript: bookmarklets outright, so a plain query
// string is the reliable way to trigger this from a bookmark on any
// browser. Completely inert otherwise — does nothing on a normal visit.
if (location.search.indexOf('test=1') !== -1 || location.hash.indexOf('test=1') !== -1) {
  var _testScript = document.createElement('script');
  _testScript.src = 'mobile_date_tester.js?' + Date.now();
  document.head.appendChild(_testScript);
}
</script>
<!-- Version 3.5 – June 2026 | Screenshot system (html2canvas → Make webhook) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Frank+Ruhl+Libre:wght@400;700;900&family=Suez+One&display=swap');
  :root { --gold: #558B7D; --gold-dark: #3D6B60; --bg: #F1F8F6; --box: #C7DDD8; --box2: #A8D5CC; --text: #3E5C54; --dim: #6B8680; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'Suez One', 'Arial Hebrew', serif;
    width: 100vw; height: 100vh; overflow: hidden;
  }

  .master-frame {
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    padding: 5px; gap: 8px;
    border: 12px solid var(--gold);
    overflow: hidden;
  }

  /* ── BRANDING BAR ─────────────────────────────────────────────── */
  .branding-bar {
    height: 5.5vh; display: flex; align-items: center;
    justify-content: center; position: relative;
    border-bottom: 1px solid #c29d6d; overflow: hidden;
  }
  .branding-shul { font-size: 4.2vh; color: var(--text); font-weight: bold; }
  #ENG_SIDE {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    font-size: 2.5vh; color: var(--gold-dark);
    font-family: 'Assistant', 'Arial Hebrew', sans-serif;
    direction: ltr; font-weight: 700; white-space: nowrap;
  }
  #WEATHER { color: var(--dim); }
  #RIGHT_SIDE {
    position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 14px; direction: rtl;
  }
  #BSD {
    font-size: 2.8vh; color: var(--gold-dark);
    font-family: 'Assistant', 'Arial Hebrew', sans-serif; font-weight: 700;
  }
  #DAF_YOMI {
    font-size: 2.2vh; color: #1a3a32;
    font-weight: 700; white-space: nowrap; direction: rtl;
    background: #A8D5CC;
    padding: 2px 10px;
    border-radius: 5px;
    border: 1px solid #7bbfb5;
  }
  #DAF_YOMI .daf-label {
    color: #1f3d35; font-weight: 400; margin-left: 6px;
  }

  /* ── AMUD YOMI PILL (branding bar, next to Daf) ─────────────── */
  #AMUD_YOMI {
    font-size: 2.2vh; color: #1a3a32;
    font-weight: 700; white-space: nowrap; direction: rtl;
    background: #A8D5CC;
    padding: 2px 10px;
    border-radius: 5px;
    border: 1px solid #7bbfb5;
  }
  #AMUD_YOMI .amud-label {
    color: #1f3d35; font-weight: 400; margin-left: 6px;
  }

  /* ── OMER BOX: Daf + Amud layout (non-Omer season) ──────────── */
  .clock-section {
    height: 18vh; display: flex;
    align-items: center; justify-content: space-between;
    border: 2px solid var(--gold); border-radius: 12px;
    background: var(--box); padding: 0; overflow: hidden;
  }
  .status-stack {
    flex: 0 0 24vw; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: var(--box); overflow: hidden;
    border-radius: 10px 0 0 10px;
    padding: 4px 8px;
  }
  #DAY_LABEL {
    font-size: 5.8vh; line-height: 0.95; padding: 0; margin: 0;
    width: 100%; text-align: center; overflow: hidden; white-space: nowrap;
    color: var(--text);
  }
  #DATE_LABEL {
    font-size: 5.0vh; line-height: 0.95; padding: 0; margin: 0;
    width: 100%; text-align: center; overflow: hidden; white-space: nowrap;
    color: var(--gold-dark);
  }
  #PARSHA_LABEL {
    font-size: 5.5vh; line-height: 1.0; padding: 0; margin: 0;
    width: 100%; text-align: center; overflow: hidden; white-space: nowrap;
    color: #000;
  }
  .main-clock {
    flex: 1 1 auto; display: flex;
    align-items: center; justify-content: center;
    direction: ltr !important;
    font-size: 19vh; font-weight: 800; color: #000000;
    font-family: 'Assistant', sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    overflow: hidden; min-width: 0;
    border-left: 1px solid #c8c0b4;
    border-right: 1px solid #c8c0b4;
  }
  .c-hour { display: inline-block; text-align: right; min-width: 1ch; }
  .c-unit { display: inline-block; width: 2ch; text-align: center; }
  .secs { font-size: 0.75em; opacity: 0.6; color: var(--text); font-weight: 700; margin-left: 1px; }
  .left-stack {
    flex: 0 0 26vw; height: 100%;
    display: flex; align-items: stretch; justify-content: stretch;
    overflow: hidden; border-radius: 0 10px 10px 0;
  }
  .message-box {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 4px 10px;
  }
  .teal-box { background: #A8D5CC; color: #000; }
  .gold-box  { color: var(--gold-dark); background: var(--box); }
  /* Elul season lines (לדוד ה' אורי / שופר / סליחות) — Option A: compact pills */
  .season-line { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .season-pill {
    font-size: 2.6vh; line-height: 1.0;
    background: #ffffffaa; border: 1px solid var(--gold-dark); color: var(--gold-dark);
    border-radius: 20px; padding: 1px 8px;
  }
  #status-head { font-size: 6.2vh; line-height: 1.0; display: block; width: 100%; }
  #status-sub  { font-size: 3.2vh; color: #000; display: block; width: 100%; white-space: normal; line-height: 1.0; }
  .geshem-tal-text { color: #000; display: block; width: 100%; white-space: normal; line-height: 1.0; }
  /* Pure color, no display/width — safe to nest inline (e.g. inside
     .head-sub-merged). .geshem-tal-text itself is display:block/width:100%
     for its own standalone use, so reusing it inline breaks the line it's
     nested in — this is the fix for exactly that mistake. */
  .force-black { color: #000; }
  .default-blessing-demoted { color: #000; display: block; width: 100%; white-space: normal; line-height: 1.0; }
  .teal-accent { color: #1a5c52; }
  /* Short vertical mark for a mid-line separator (e.g. geshem/tal combined
     with the default blessing) — deliberately NOT the same as .text-sep
     (which divides whole blocks); this one sits inline within a single
     line of text, so it must stay visually short even as that line's
     shared font-size grows, rather than stretching to full text height
     like a plain "│" character would. */
  .mid-divider { font-size: 0.55em; vertical-align: middle; margin: 0 0.3em; color: inherit; }
  /* Merged head+sub line — used only once the box has more than 3 blocks,
     so head and sub share one line instead of two, saving a row on busy
     days. Deliberately NOT display:block on the individual head/sub text
     (that would force them apart again) — the outer span is the block,
     the two texts inside flow inline separated by the short mid-divider. */
  .head-sub-merged { display: block; width: 100%; line-height: 1.0; }
  .text-sep { width: 55%; height: 1px; background: rgba(0,0,0,0.28); margin: 0; flex-shrink: 0; }
  #status-kl {
    background: #c0392b; border: 1px solid var(--gold-dark); color: #ffffff;
    border-radius: 20px; padding: 1px 8px; line-height: 1.0;
    display: inline-block; margin-top: 2px;
  }

  /* ── MAIN BODY ───────────────────────────────────────────────── */
  .main-body {
    flex: 1; display: flex; gap: 8px; overflow: hidden; min-height: 0;
  }

  .zemanim-header {
    background: var(--gold); color: #000;
    font-size: 3.0vh; line-height: 1; font-weight: 800;
    text-align: center; display: flex; align-items: center; justify-content: center;
    padding: 1px 8px;
    border-radius: 8px 8px 0 0; flex-shrink: 0;
    letter-spacing: 0.03em;
  }
  /* ── ZEMANIM ─────────────────────────────────────────────────── */
  .zemanim-col-wrap {
    width: 23vw; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .zemanim-col {
    width: 100%; border: 2px solid var(--gold); border-radius: 10px;
    display: flex; flex-direction: column; padding: 2px;
    background: var(--box); overflow: hidden; flex-shrink: 0;
  }
  .z-row {
    display: flex; justify-content: space-between;
    padding: 0px 8px; border-bottom: 1px solid #d4cec6;
    align-items: center; flex: 1; overflow: hidden;
  }
  .z-row:last-child { border-bottom: none; }
  .z-label { color: #1f3d35; font-size: 3.6vh; }
  .z-time  { color: #1a2e28; font-size: 3.2vh; font-family: 'Assistant', sans-serif; font-weight: 700; direction: ltr; }
  .active-zman { background: #A8D5CC !important; }
  .active-zman .z-label, .active-zman .z-time { color: #000 !important; }

  /* ── PORTRAIT IMAGE (8.5:11) ─────────────────────────────────── */
  .portrait-col {
    flex-shrink: 0;
    aspect-ratio: 8.5 / 11;
    border: 2px solid var(--gold); border-radius: 10px;
    background: var(--box2); overflow: hidden; position: relative;
  }
  .portrait-col img {
    width: 100%; height: 100%; object-fit: fill;
    position: absolute; top: 0; left: 0;
    transition: opacity 0.8s ease-in-out;
  }

  /* ── MIDDLE COLUMN ───────────────────────────────────────────── */
  .middle-col {
    flex: 1; display: flex; flex-direction: column;
    gap: 8px; overflow: hidden; min-width: 0;
  }
  .data-box {
    flex: 0.8; border: 2px solid var(--gold); border-radius: 10px;
    background: var(--box); display: flex; align-items: center;
    justify-content: center; text-align: center;
    padding: 8px 12px; overflow: hidden;
  }
  .data-box span {
    font-weight: 400; font-size: 4.8vh; line-height: 1.1;
    display: block; width: 100%; word-wrap: break-word;
    color: var(--text); unicode-bidi: plaintext;
  }
  /* Daily Halachos box */
  .rabbi-box {
    flex: 1.2; border: 2px solid var(--gold); border-radius: 10px;
    background: var(--box2); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .rabbi-header {
    background: var(--gold); color: #000;
    font-size: 3.0vh; line-height: 1; font-weight: 800;
    text-align: center; display: flex; align-items: center; justify-content: center;
    padding: 1px 8px;
    border-radius: 8px 8px 0 0; flex-shrink: 0;
    letter-spacing: 0.03em;
  }
  .rabbi-body {
    flex: 1; display: flex; align-items: center;
    justify-content: center; padding: 2px 4px;
    overflow: hidden;
  }
  .rabbi-body.dvar-torah {
    align-items: flex-start;
    padding-top: 6px;
  }
  #RABBI {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 4.0vh; line-height: 1.5; color: #1a1a1a;
    font-style: normal; font-weight: 700;
    display: block; width: 100%; word-wrap: break-word;
    direction: rtl; text-align: center; unicode-bidi: plaintext;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .omer-box {
    flex: 1; border: 2px solid var(--gold); border-radius: 10px;
    background: #d4eae6; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4px 6px; text-align: center; overflow: hidden;
  }
  #O2 {
    color: #1a4a3a; font-weight: 600; line-height: 1.3;
    width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center;
    word-wrap: break-word; overflow: hidden; unicode-bidi: plaintext;
  }

  .daf-box {
    flex-shrink: 0;
    border: 2px solid #7bbfb5; border-radius: 10px;
    background: #A8D5CC;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 5px 8px; text-align: center;
    gap: 1px;
  }
  .daf-box-label {
    font-size: 2.2vh; color: #3D6B60; font-weight: 600;
    font-family: 'Frank Ruhl Libre', 'Arial Hebrew', serif;
    line-height: 1;
  }
  .daf-box-text {
    font-size: 3.0vh; color: #1a3a32; font-weight: 700;
    font-family: 'Frank Ruhl Libre', 'Arial Hebrew', serif;
    line-height: 1.2; direction: rtl;
  }
  .donation-col {
    width: 22vw; flex-shrink: 0;
    display: flex; flex-direction: column;
    gap: 8px; overflow: hidden;
  }
  .donation-col .omer-box {
    flex: 1.5; min-height: 0; overflow: hidden;
  }
  .omer-daf-amud {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 0; overflow: hidden;
    padding: 4px 2px;
  }
  .omer-daf-amud .da-label {
    font-size: 2.4vh; font-weight: 700; color: #1a1a1a;
    text-align: center; direction: rtl; line-height: 1.1;
    flex-shrink: 0;
  }
  .omer-daf-amud .da-text {
    font-size: 3.4vh; font-weight: 900; color: #1a1a1a;
    text-align: center; direction: rtl; line-height: 1.1;
    flex-shrink: 0;
  }
  .omer-daf-amud .da-divider {
    width: 65%; height: 1px; background: #c29d6d;
    border-radius: 1px; margin: 4px 0; flex-shrink: 0;
  }
  .donation-box {
    flex: 2; border: 2px solid var(--gold); border-radius: 10px;
    background: var(--box); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .donation-title {
    background: var(--gold); color: #000;
    font-size: 3.2vh; font-weight: 700;
    text-align: center; padding: 4px 8px;
    border-radius: 8px 8px 0 0; flex-shrink: 0;
    letter-spacing: 0.03em;
  }
  .donation-body {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 0; gap: 0;
  }
  .donor-entry {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 4px 8px; overflow: hidden;
    border-bottom: 1px solid var(--gold);
  }
  .donor-entry:last-child { border-bottom: none; }
  .donor-dedication {
    color: var(--gold-dark); font-size: 5.0vh; line-height: 1.15;
    font-family: 'Suez One', 'Arial Hebrew', serif;
    font-weight: 400; word-wrap: break-word; width: 100%;
    padding-bottom: 3px; unicode-bidi: plaintext;
    border-bottom: 1px solid #c8b48a;
  }
  .donor-name {
    color: #2e4a44; font-size: 4.2vh; line-height: 1.15;
    font-family: 'Suez One', 'Arial Hebrew', serif;
    font-weight: 400; word-wrap: break-word; width: 100%;
    padding-top: 3px; unicode-bidi: plaintext;
  }
  .donation-empty {
    color: var(--dim); font-size: 2.6vh; text-align: center;
    padding: 10px; font-family: 'Assistant', sans-serif;
  }

  /* ── SLEEP OVERLAY ───────────────────────────────────────────── */
  #SLEEP_OVERLAY {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: black; z-index: 10000; display: none;
  }
  #SLEEP_CLOCK {
    position: absolute; color: #444;
    font-family: 'Assistant', sans-serif;
    font-size: 8vh; font-weight: 700;
    transition: all 2.0s ease-in-out; white-space: nowrap;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
  }

  /* ── DELETE CONFIRMATION MODAL ─────────────────────────────────── */
  #confirmModal {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.7); z-index: 10001; display: none;
    align-items: center; justify-content: center;
  }
  .modal-content {
    background: var(--bg); padding: 30px; border-radius: 12px;
    text-align: center; min-width: 300px;
    border: 3px solid var(--gold); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .modal-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: var(--text); }
  .modal-message { font-size: 18px; margin-bottom: 30px; color: var(--dim); line-height: 1.6; }
  .modal-buttons { display: flex; gap: 15px; justify-content: center; }
  .modal-btn {
    padding: 12px 24px; font-size: 16px; font-weight: bold;
    border: none; border-radius: 6px; cursor: pointer;
    transition: all 0.3s;
  }
  .btn-confirm { background: #c0392b; color: white; }
  .btn-confirm:hover { background: #a02d1f; }
  .btn-cancel { background: var(--box); color: var(--text); border: 2px solid var(--gold); }
  .btn-cancel:hover { background: var(--gold); }

  /* ── SHAVUOT FLOWER BORDER ────────────────────────────────────────── */
  #flowerBorderFrame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: -1;
    background-image: url('https://raw.githubusercontent.com/BerkoDesigns/ChesedVemes/main/—Pngtree—floral%20border%20watercolor%20rose%20flowers_8816915.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: none;
  }
  
  body.shavuot-mode {
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  body.shavuot-mode #flowerBorderFrame {
    display: block;
  }
  
  body.shavuot-mode .master-frame {
    height: calc(100vh - 24px);
    width: calc(100vw - 24px);
    margin: 12px;
    border: none;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
  }

  /* ── SHAVUOT MODE: BLACK TEXT FOR TOP ROW ──────────────────────── */
  body.shavuot-mode .branding-shul {
    color: #000000 !important;
    font-weight: bold;
  }
  
  body.shavuot-mode #ENG_SIDE {
    color: #000000 !important;
    font-weight: bold;
  }
  
  body.shavuot-mode #ENG_DATE {
    color: #000000 !important;
  }
  
  body.shavuot-mode #WEATHER {
    color: #000000 !important;
  }
  
  body.shavuot-mode #BSD {
    color: #000000 !important;
    font-weight: bold;
  }
  /* ── FULLSCREEN BUTTON (mobile only) ───────────────────────── */
  #fullscreen-btn {
    display: none; /* hidden by default */
    position: fixed; bottom: 16px; right: 16px; z-index: 9999;
    background: rgba(0,0,0,0.55); color: #fff;
    border: none; border-radius: 50px;
    padding: 10px 18px; font-size: 16px;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  @media (max-width: 1024px) and (pointer: coarse) {
    #fullscreen-btn { display: block; }
  }

</style>
</head>
<body>

<button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ fullscreen</button>

<div id="SLEEP_OVERLAY"><div id="SLEEP_CLOCK">00:00:00</div></div>

<!-- Shavuot Flower Border Frame -->
<div id="flowerBorderFrame"></div>

<!-- Delete Confirmation Modal -->
<div id="confirmModal">
  <div class="modal-content">
    <div class="modal-title">⚠️ Confirm Delete</div>
    <div class="modal-message" id="confirmMessage">Are you sure?</div>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" onclick="cancelDelete()">Cancel</button>
      <button class="modal-btn btn-confirm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="master-frame">

  <div class="branding-bar">
    <div id="ENG_SIDE"><span id="ENG_DATE"></span><span id="WEATHER"></span></div>
    <div class="branding-shul">קהל חסד ואמת</div>
    <div id="RIGHT_SIDE">
      <span id="BSD">בס"ד</span>
      <span id="DAF_YOMI"></span>
      <span id="AMUD_YOMI"></span>
    </div>
  </div>

  <div class="clock-section">
    <div class="status-stack">
      <div id="DAY_LABEL">--</div>
      <div id="DATE_LABEL" style="color: var(--gold);">--</div>
      <div id="PARSHA_LABEL">--</div>
    </div>
    <div class="main-clock" id="CLOCK">
      <span class="c-hour">0</span>:<span class="c-unit">00</span>:<span class="c-unit">00</span>
    </div>
    <div class="left-stack" id="LEFT_MSG"></div>
  </div>

  <div class="main-body">

    <!-- 1. ZEMANIM — the live, sorted, time-highlighted list — and, stacked
         below it as a genuinely separate box, the always-visible davening
         times box (never day-gated, never mixed into the live list) -->
    <div class="zemanim-col-wrap">
      <div class="zemanim-col" id="ZMANIM_LIST" style="flex: 11;">
        <div class="zemanim-header">זמני היום</div>
      </div>
      <div class="zemanim-col" id="ZMANIM_TEFILA" style="flex: 5;">
        <div class="zemanim-header">זמנים התפילה בימי חול</div>
      </div>
    </div>

    <!-- 2. PORTRAIT IMAGE — rotates through folder images, freezes on Shabbat -->
    <div class="portrait-col">
      <img id="PORT_IMG" src="" alt="" style="transition: opacity 0.8s ease-in-out;">
    </div>

    <!-- 3. MIDDLE -->
    <div class="middle-col">
      <div class="data-box"><span id="ANN">טוען מידע...</span></div>
      <div class="rabbi-box">
        <div class="rabbi-header" id="RABBI-HEADER">הלכה יומית</div>
        <div class="rabbi-body">
          <span id="RABBI"></span>

    if (total < 0) total += 86400;
    if (total >= 86400) total -= 86400;
    let nh = Math.floor(total / 3600), nm = Math.floor((total % 3600) / 60), ns = total % 60;
    if (nh > 12) nh -= 12; if (nh === 0) nh = 12;
    return nh + ":" + String(nm).padStart(2,'0') + ":" + String(ns).padStart(2,'0');

 * e.g. "ט״ו ניסן תשפ״ה" → 15, "כ״ב תשרי" → 22
 */
function extractHebDay(hebStr) {
    const HEB_VALS = {
        'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,
        'י':10,'כ':20,'ך':20,'ל':30
    };
    let match = hebStr.trim().match(/^([\u05D0-\u05EA"'\u05F3\u05F4]+)/);
    if (!match) return 0;
    let tok = match[1].replace(/['"״\u05F3\u05F4]/g, "");
    let total = 0;
    for (let ch of tok) { if (HEB_VALS[ch] !== undefined) total += HEB_VALS[ch]; }
    return total;
}

    if (month === "שבט" && day === 15) return true;                    // Tu B'Shvat
    if (month === "אייר" && (day === 14 || day === 18)) return true;   // Pesach Sheni, Lag Ba'omer
    if (month === "ניסן") return true;                                 // Entire Nissan
    if (month === "תשרי" && day >= 11 && day <= 14) return true;       // Between YK and Sukkot
    if (month === "סיון" && day <= 7) return true;                     // RC Sivan through day after Shavuos
    // Purim / Shushan Purim (real Adar or Adar Sheni), Purim Katan (Adar Rishon)
    if ((month === "אדר" || month === "אדר-ב") && (day === 14 || day === 15)) return true;
    if (month === "אדר-א" && (day === 14 || day === 15)) return true;
    // Chanukah — 8 days from Kislev 25, computed by ISO offset since it
    // spans into Tevet and the exact end date depends on Kislev's length
    // that year (29 or 30 days).
    let k25 = findKislev25Iso(todayIso);
    if (k25) {
        let diffDays = (new Date(todayIso).getTime() - new Date(k25).getTime()) / 86400000;
        if (diffDays >= 0 && diffDays <= 7) return true;
    }
    return false;
}

// ── TZIDKATCHA (אין אומרים צדקתך) — Shabbat Mincha only ─────────────
// Two genuinely distinct rule categories, per posek-reviewed correction
// (Aug 2026) to the original single-list version — do not collapse these
// back into one "is it a no-Tachanun day" check:
//
// PART A — Shabbat itself is a day on which Tachanun would be skipped:
// Tzidkatcha is omitted outright, independent of what Sunday is. This is
// the FULL no-Tachanun scope (all 8 days of Chanukah, not just day 1).
//
// PART B — Shabbat itself is ordinary, but the upcoming Sunday is a
// no-Tachanun day: Tzidkatcha is STILL omitted for most such Sundays, but
// NOT for two explicit, deliberately-coded exceptions:
//   - Pesach Sheni on Sunday → Tzidkatcha IS said (Ashkenazic Luach Eretz
//     Yisrael; genuine minhag variation exists, this board follows that).
//   - Tisha B'Av on Sunday → Tzidkatcha IS said (aveilus day, not simcha —
//     the opposite of every other entry on this list).
// These two are deliberately absent from Part B below — do not add them.
function isTzidkatchaOmittedShabbat(todayHeb, todayHolidayText, tomorrowHeb, tomorrowHolidayText, todayIso) {
    let todayMonth = getHebMonthOnly(todayHeb);
    let todayDay = extractHebDay(todayHeb);

    // ── PART A: today (Shabbat) itself ──
    if ((todayHolidayText || "").includes("ראש חודש")) return true;             // Rosh Chodesh
    let k25 = findKislev25Iso(todayIso);
    if (k25) {
        let diffDays = (new Date(todayIso).getTime() - new Date(k25).getTime()) / 86400000;
        if (diffDays >= 0 && diffDays <= 7) return true;                        // Any day of Chanukah
    }
    if ((todayMonth === "אדר" || todayMonth === "אדר-ב") && (todayDay === 14 || todayDay === 15)) return true; // Purim/Shushan Purim
    if (todayMonth === "אדר-א" && (todayDay === 14 || todayDay === 15)) return true; // Purim Katan/Shushan Purim Katan
    if (todayMonth === "שבט" && todayDay === 15) return true;                   // Tu B'Shvat
    if (todayMonth === "ניסן") return true;                                     // Entire Nisan
    if (todayMonth === "סיון" && todayDay >= 8 && todayDay <= 12) return true;   // Day after Shavuot – 12 Sivan
    if (todayMonth === "תשרי" && todayDay >= 14 && todayDay <= 24) return true;  // Erev Sukkot – day after Simchat Torah
    if (todayMonth === "אייר" && todayDay === 18) return true;                  // Lag Ba'omer
    if (todayMonth === "אייר" && todayDay === 14) return true;                  // Pesach Sheni (Shabbat-itself — Part A, unlike Part B below)
    if (todayMonth === "אב" && todayDay === 15) return true;                    // Tu B'Av
    if (roshHashanahIso && yomKippurIso && todayIso > roshHashanahIso && todayIso < yomKippurIso) return true; // Shabbat Shuvah

    // ── PART B: upcoming Sunday — Tisha B'Av deliberately excluded (source-
    // confirmed: Sunday=Tisha B'Av → Tzidkatcha IS said on the preceding
    // Shabbat, aveilus day, not simcha). Pesach Sheni is NOT excluded here
    // — per the printed source's general rule (Shabbat before any
    // no-Tachanun day → no Tzidkatcha, with only Erev RH/YK as the named
    // exception), Sunday=Pesach Sheni is an ordinary trigger like the rest.
    let sunMonth = getHebMonthOnly(tomorrowHeb);
    let sunDay = extractHebDay(tomorrowHeb);
    if ((tomorrowHolidayText || "").includes("ראש חודש")) return true;          // Rosh Chodesh
    if (sunMonth === "כסלו" && sunDay === 25) return true;                      // Chanukah — day 1 only
    if ((sunMonth === "אדר" || sunMonth === "אדר-ב") && (sunDay === 14 || sunDay === 15)) return true; // Purim/Shushan Purim
    if (sunMonth === "אדר-א" && (sunDay === 14 || sunDay === 15)) return true;  // Purim Katan/Shushan Purim Katan
    if (sunMonth === "שבט" && sunDay === 15) return true;                       // Tu B'Shvat
    if (sunMonth === "אייר" && sunDay === 14) return true;                      // Pesach Sheni
    if (sunMonth === "אייר" && sunDay === 18) return true;                      // Lag Ba'omer
    if (sunMonth === "אב" && sunDay === 15) return true;                        // Tu B'Av

    return false;
}

// ── ELUL SEASON (לדוד ה' אורי / שופר / סליחות) ─────────────────────
// Subtracts `days` from an ISO date string, returning a new ISO string.
function getIsoMinusDays(iso, days) {
    let d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() - days);
    return getIso(d);
}

// Ashkenazi Selichot start: the Motzei Shabbat immediately before Rosh
// Hashanah — pushed back one additional week if RH falls on Monday or
// Tuesday, to guarantee at least 4 days of Selichot beforehand. RH can only
// ever fall on Mon/Tue/Thu/Sat (never Sun/Wed/Fri), so those are the only
// day-of-week values this needs to handle.
function computeSelichotStartIso(rhIso) {
    let rhDate = new Date(rhIso + 'T00:00:00');
    let rhDow = rhDate.getDay();
    let daysBackToSat = (rhDow === 6) ? 7 : (rhDow + 1);
    let start = getIsoMinusDays(rhIso, daysBackToSat);
    if (rhDow === 1 || rhDow === 2) start = getIsoMinusDays(start, 7);
    return start;
}

// Scans the loaded schedule once (called from applyData after schedule
// loads, not every second) to find this Hebrew-year's key Elul/Tishrei
// dates. Only considers dates from ~60 days before today onward, so a
// schedule spanning more than one Hebrew year always resolves to the
// current/upcoming season rather than a stale past one.
function computeSeasonDates() {
    elulTriggerDayIso = null; elulEveIso = null;
    roshHashanahIso = null; yomKippurIso = null; shminiAtzeretIso = null;
    selichotStartIso = null; pesach1Iso = null;
    if (!schedule) return;
    let searchFloor = getIsoMinusDays(getIso(new Date()), 60);
    let isos = Object.keys(schedule).sort();
    for (let iso of isos) {
        if (iso < searchFloor) continue;
        let heb = (schedule[iso] || {}).heb || "";
        if (!heb) continue;
        let day = extractHebDay(heb);
        if (!elulTriggerDayIso && heb.includes("אלול") && day === 1) elulTriggerDayIso = iso;
        if (!roshHashanahIso && heb.includes("תשרי") && day === 1) roshHashanahIso = iso;
        if (!yomKippurIso && heb.includes("תשרי") && day === 10) yomKippurIso = iso;
        if (!shminiAtzeretIso && heb.includes("תשרי") && day === 22) shminiAtzeretIso = iso;
        if (!pesach1Iso && heb.includes("ניסן") && day === 15) pesach1Iso = iso;
    }
    if (elulTriggerDayIso) elulEveIso = getIsoMinusDays(elulTriggerDayIso, 1);
    if (roshHashanahIso) selichotStartIso = computeSelichotStartIso(roshHashanahIso);
}

// Given a date, finds the season (Geshem/Tal) it falls in by looking
// FORWARD from that exact date for the next Shmini Atzeret (by name — it's
// a single, unambiguous day) and the next Pesach 1 specifically (Pesach
// spans multiple days — 1, 2, 7, 8 — that likely all mention פסח in
// holidayText, so day 1 needs the Nissan-15 date check, same one used
// elsewhere in this file, to avoid mistaking day 2/7/8 for the boundary).
// Whichever comes first tells you the season. No cached state to go
// stale — recomputed fresh on every call (cheap forward scan) rather than
// once per data load, so it can never drift out of sync with whatever
// date is actually being checked.
function getGeshemTalSeason(todayIso) {
    if (!schedule) return { season: null, boundary: null };
    let isos = Object.keys(schedule).sort();
    let nextSA = null, nextPesach1 = null;
    for (let iso of isos) {
        if (iso < todayIso) continue;
        let entry = schedule[iso] || {};
        let hText = entry.holidayText || "";
        let heb = entry.heb || "";
        if (!nextSA && hText.includes("שמיני עצרת")) nextSA = iso;
        if (!nextPesach1 && heb.includes("ניסן") && extractHebDay(heb) === 15) nextPesach1 = iso;
        if (nextSA && nextPesach1) break;
    }
    if (nextPesach1 && (!nextSA || nextPesach1 < nextSA)) return { season: 'geshem', boundary: nextPesach1 };
    if (nextSA) return { season: 'tal', boundary: nextSA };
    return { season: null, boundary: null };
}

// Shared "starts the evening before a target date, N minutes before RT"
// trigger used by both לדוד and שופר's season start.
function isPastEveningTrigger(targetEveIso, todayIso, cSecNow, offsetMinutes) {
    if (!targetEveIso) return false;
    if (todayIso > targetEveIso) return true;
    if (todayIso < targetEveIso) return false;
    // todayIso === targetEveIso: check time-of-day against RT - offset
    let eveEntry = schedule[todayIso];
    if (!eveEntry || !eveEntry.z) return false;
    let rtSecsEve = getSec(eveEntry.z[10], true);
    return cSecNow >= (rtSecsEve - offsetMinutes * 60);
}

function isLedavidActive(todayIso, cSecNow) {
    if (!elulEveIso) return false;
    if (!isPastEveningTrigger(elulEveIso, todayIso, cSecNow, 25)) return false; // Chesed V'Emes: 25 min
    if (!shminiAtzeretIso) return true; // end date not yet known — show anyway
    if (todayIso < shminiAtzeretIso) return true;
    if (todayIso === shminiAtzeretIso) return cSecNow < 43200; // midday cutoff
    return false;
}

// מוריד הגשם — always visible (every day, Shabbos/Yom Tov included), unlike
// ותן טל ומטר/ותן ברכה which only apply on weekdays. Starts at Shmini
// Atzeret's actual Mincha Gedolah zman, ends at 1st day Pesach's Mincha
// Gedolah — precise holiday-name + zman triggers, not a civil-month guess.
function isGeshemActive(todayIso, cSecNow) {
    let { season, boundary } = getGeshemTalSeason(todayIso);
    if (season === 'geshem') {
        if (!boundary || todayIso < boundary) return true;
        // today IS Pesach 1 itself — active until Mincha Gedolah
        let entry = schedule[todayIso];
        if (!entry || !entry.z) return true;
        return cSecNow < getSec(entry.z[7], true);
    }
    if (season === 'tal' && boundary === todayIso) {
        // today IS Shmini Atzeret itself — Geshem starts at a fixed 12:00 PM
        return cSecNow >= 43200;
    }
    return false;
}

// מזמור שיר חנוכת הבית — all 8 days of Chanukah, Alos through Chatzot
// Hayom, weekdays only. Chesed V'Emes is Ashkenaz: not said on Shabbat
// Chanukah (the Shabbat psalm takes that slot). Bayswater/Kahal Chasidim
// is Sefard, whose copy of this function deliberately has NO Shabbat
// exclusion — the two boards' versions differ on purpose, not a slip.
// FIX (Aug 2026): Chatzot's getSec() call used pm=true unconditionally,
// forcing legitimate before-noon Chatzot values (e.g. 11:57 AM, common
// in winter/EST — Chanukah always falls in EST) into 23:57, making the
// "before Chatzot" window last almost the whole day. Every getSec(...,
// z[6], true) call in both files (this function, the חצות היום zman row,
// and the Tal Umatar Pesach-1 switch) changed to pm=false — z[6]'s raw
// hour digit (11 or 12) is already unambiguous without forcing.
function isChanukatHabayitActive(todayIso, cSecNow, isShabNow) {
    if (isShabNow) return false; // Ashkenaz — not said on Shabbat Chanukah
    let k25 = findKislev25Iso(todayIso);
    if (!k25) return false;
    let diffDays = (new Date(todayIso).getTime() - new Date(k25).getTime()) / 86400000;
    if (diffDays < 0 || diffDays > 7) return false; // any of the 8 days
    let entry = schedule[todayIso];
    if (!entry || !entry.z) return false;
    return cSecNow >= getSec(entry.z[0], false) && cSecNow < getSec(entry.z[6], false); // Alos through Chatzot
}

function isShofarActive(todayIso, cSecNow, isShabNow) {
    if (isShabNow) return false; // never once Shabbos has begun (accounts for Friday candle lighting)
    if (!elulEveIso || !roshHashanahIso) return false;
    if (!isPastEveningTrigger(elulEveIso, todayIso, cSecNow, 25)) return false; // Chesed V'Emes: 25 min
    let shofarEndIso = getIsoMinusDays(roshHashanahIso, 2); // stops 2 days before RH
    if (todayIso > shofarEndIso) return false;
    // Shofar is never blown at night — only Alos through Plag Hamincha, every
    // day of the season. The evening-before trigger above still controls
    // which calendar day counts as "in season," but visibility itself is
    // gated fresh each day by this window regardless of that.
    let entry = schedule[todayIso];
    if (!entry || !entry.z) return false;
    return cSecNow >= getSec(entry.z[0], false) && cSecNow < getSec(entry.z[8], true);
}

function isSelichotActive(todayIso, cSecNow, isShabNow, isYomTov) {
    if (!selichotStartIso || !yomKippurIso) return false;
    let erevYkIso = getIsoMinusDays(yomKippurIso, 1);
    if (todayIso < selichotStartIso || todayIso > erevYkIso) return false;
    // Start day is always a Saturday by design (Motzei Shabbat) — check it
    // before the general Shabbos/Yom Tov exclusion below, since the trigger
    // only fires once Shabbos ends that same calendar Saturday.
    if (todayIso === selichotStartIso) {
        let startEntry = schedule[todayIso];
        if (!startEntry || !startEntry.z) return false;
        return cSecNow >= getSec(startEntry.z[10], true); // begins once Shabbos ends (RT)
    }
    if (isShabNow || isYomTov) return false; // never once Shabbos has begun (incl. Friday candle lighting), or Yom Tov (RH, YK)
    if (todayIso === erevYkIso) return cSecNow < 43200; // one-time noon cutoff
    return true; // any day strictly between start and Erev YK
}

// הושענות — Sukkot days 1-6 only (Tishrei 15-20; day 7/Hoshana Rabbah
// excluded — all piyutim are said that day, nothing to single out). Active
// window is Alos through Mincha Gedolah on the REAL civil day (todayIso via
// dToday's own zmanim), independent of the board's flip boundary — same
// principle as Kiddush Levana's own independent boundary.
//
// Fixed lookup table, not a formula — verified against 4 independent
// printed/digital siddur sources (Sefaria Siddur Sefard, a Bayswater
// printed Sefard page, and two Ashkenaz printed calendar pages), keyed by
// the weekday Sukkot day 1 (Tishrei 15) falls on. Confirmed with the Rabbi
// that Kahal Chassidim (Nusach Sefard) and Bay 24 (Ashkenaz) say the exact
// same sequence — the only rite where it differs is Sefard Ari, which
// neither shul follows — so one shared table serves both boards.
const HOSHANA_TABLE = {
    1: ["למען אמתך", "אבן שתיה", "אערוך שועי", "אום אני חומה", "אל למושעות", "אום נצורה"],  // Sukkot day 1 = Monday
    2: ["למען אמתך", "אבן שתיה", "אערוך שועי", "אל למושעות", "אום נצורה", "אדון המושיע"],   // Sukkot day 1 = Tuesday
    4: ["למען אמתך", "אבן שתיה", "אום נצורה", "אערוך שועי", "אל למושעות", "אדון המושיע"],   // Sukkot day 1 = Thursday
    6: ["אום נצורה", "למען אמתך", "אערוך שועי", "אבן שתיה", "אל למושעות", "אדון המושיע"]    // Sukkot day 1 = Shabbat
};

function getHoshanaText(todayIso, cSecNow, alosSec, minchaGedolahSec) {
    let entry = schedule[todayIso];
    if (!entry || !entry.heb) return "";
    if (getHebMonthOnly(entry.heb) !== "תשרי") return "";
    let day = extractHebDay(entry.heb);
    if (day < 15 || day > 20) return "";
    if (cSecNow < alosSec || cSecNow >= minchaGedolahSec) return "";

    let sukkotDayNum = day - 14; // 1-6
    let tishrei15Iso = getIsoMinusDays(todayIso, sukkotDayNum - 1);
    let startDow = new Date(tishrei15Iso + 'T00:00:00').getDay();

    let seq = HOSHANA_TABLE[startDow];
    return seq ? (seq[sukkotDayNum - 1] || "") : "";
}

// על הנסים — active all day, every day, for the full 8 days of Chanukah
// (reusing the same Kislev-25 ISO-offset anchor as the no-Tachanun check,
// since Chanukah spans into Tevet) and on Purim only — 14 Adar (or 14
// Adar Sheni in a leap year) — NOT Shushan Purim (15) and NOT Purim Katan
// (Adar Rishon), since Al Hanissim isn't said on either of those. No
// start-side restriction, but on the LAST day of each (Purim itself, since
// it's a single day; Chanukah day 8) it ends offsetSec before RT that
// evening, same pattern as isLedavidActive's Simchat Torah cutoff —
// Bayswater passes 1200 (20 min), Chesed V'Emes passes 1500 (25 min).
function getAlHanissimText(todayIso, cSecNow, offsetSec) {
    let entry = schedule[todayIso];
    if (!entry || !entry.heb) return "";
    let month = getHebMonthOnly(entry.heb);
    let day = extractHebDay(entry.heb);

    if ((month === "אדר" || month === "אדר-ב") && day === 14) {
        if (!entry.z) return "על הנסים"; // no zman data — show anyway rather than hide
        return (cSecNow < (getSec(entry.z[10], true) - offsetSec)) ? "על הנסים" : "";
    }

    let k25 = findKislev25Iso(todayIso);
    if (k25) {
        let diffDays = (new Date(todayIso).getTime() - new Date(k25).getTime()) / 86400000;
        if (diffDays >= 0 && diffDays < 7) return "על הנסים"; // days 1-7, unrestricted
        if (diffDays === 7) { // day 8 — ends offsetSec before RT tonight
            if (!entry.z) return "על הנסים";
            return (cSecNow < (getSec(entry.z[10], true) - offsetSec)) ? "על הנסים" : "";
        }
    }
    return "";
}

function fit(el, vhStart) {
    if (!el) return;
    let p = el.parentElement, vh = vhStart;
    el.style.fontSize = vh + "vh";
    while ((p.scrollWidth > p.clientWidth || p.scrollHeight > p.clientHeight) && vh > 1.0) {
        vh -= 0.1;
        el.style.fontSize = vh + "vh";
    }
}
// fitInBox: same as fit but uses explicit container for overflow check
function fitInBox(el, container, vhStart) {
    if (!el || !container) return;
    let vh = vhStart;
    el.style.fontSize = vh + "vh";
    while (container.scrollHeight > container.clientHeight && vh > 1.0) {
        vh = Math.max(1.0, vh - 0.15);
        el.style.fontSize = vh + "vh";
    }
}

// Same idea as fitInBox, but for a whole group of elements that should all
// end up the SAME size (e.g. several pills side by side) — sizes them all
// together in lockstep, rather than fitting each one independently (which
// resets and re-shrinks one at a time, leaving them mismatched and not
// actually guaranteeing the combined group fits).
function fitGroupInBox(els, container, vhStart) {
    if (!els || !els.length || !container) return;
    let vh = vhStart;
    els.forEach(el => el.style.fontSize = vh + "vh");
    while (container.scrollHeight > container.clientHeight && vh > 1.0) {
        vh = Math.max(1.0, vh - 0.15);
        els.forEach(el => el.style.fontSize = vh + "vh");
    }
}

// Sizes the whole status box as ONE shared font size across every visible
// block (head, sub, KL badge, season pills, geshem/default lines) — no
// element gets special weighting, everyone shares equally, per the approved
// mockup (status_box_mockup.html). Grows the shared size up when there's
// slack, shrinks it down when there isn't, via binary search against the
// box's real, fixed dimensions — the box itself never resizes, content
// always ends up filling exactly what's available with zero overflow.
// Checks every individual block's own bounding box against the container,
// not just aggregate scrollHeight — catches horizontal overflow (e.g. a
// wrapped pill bleeding past the edge) that scrollHeight alone would miss.
function fitStatusBoxToFill(container, visualRowCount) {
    if (!container) return;
    // Wait for webfonts to actually be ready before measuring — if
    // 'Suez One'/'Assistant' haven't finished loading yet, measuring
    // against fallback-font metrics would lock in a size that no longer
    // matches once the real font swaps in. Resolves immediately once
    // fonts are already loaded (the normal case on every re-render).
    document.fonts.ready.then(() => {
    // KL badge is now a single element (matches the pills), so one
    // selector covers both text-sizing and containment checks.
    const SEL = '#status-head, [id="status-sub"], .season-pill, #status-kl, .geshem-tal-demoted, .default-blessing-demoted, .head-sub-merged';
    let textEls = Array.from(container.querySelectorAll(SEL));
    if (!textEls.length) return;

    function applySize(vh) {
        textEls.forEach(el => el.style.fontSize = vh + "vh");
    }

    // SAFETY is a real pixel buffer (not subpixel rounding tolerance) —
    // guarantees actual headroom on every side so ordinary rendering
    // differences between browsers/devices can never tip a "fits" result
    // into visible overflow on the real board, the way a razor-thin
    // (<0.2px) margin did before.
    const SAFETY = 2.0;
    function fits() {
        const cRect = container.getBoundingClientRect();
        const blocks = container.querySelectorAll(SEL);
        for (const el of blocks) {
            const r = el.getBoundingClientRect();
            if (r.right  > cRect.right  - SAFETY) return false;
            if (r.bottom > cRect.bottom - SAFETY) return false;
            if (r.left   < cRect.left   + SAFETY) return false;
            if (r.top    < cRect.top    + SAFETY) return false;
        }
        return true;
    }

    // 8.0vh ceiling ONLY for the 2-line case (e.g. just head+sub) — that's
    // the one scenario where filling 100% of the box looked disproportion-
    // ately huge. Everything else (3+ visual lines, including the merged
    // head+sub case which is always 3+ underneath) searches freely up to
    // a generous ceiling so it actually fills the available space, rather
    // than being held back by a cap that was only ever meant for the
    // sparsest case.
    let isSparse = (visualRowCount || 0) <= 2;
    let lo = 1.0, hi = isSparse ? 8.0 : 14.0, best = lo;
    for (let i = 0; i < 20; i++) {
        let mid = (lo + hi) / 2;
        applySize(mid);
        void container.offsetHeight; // force reflow before measuring
        if (fits()) { best = mid; lo = mid; } else { hi = mid; }
    }
    applySize(best);
    });
}

// fitExpand: grow text UP to fill available space, also shrink below vhStart if needed
function fitExpand(el, vhStart, vhMax) {
    if (!el) return;
    let container = el.parentElement;
    if (!container) return;
    let vh = vhStart;
    el.style.fontSize = vh + "vh";
    
    // Grow UP until text fills the box or hits vhMax
    while (el.scrollHeight < container.clientHeight && vh < vhMax) {
        vh += 0.15;
        el.style.fontSize = vh + "vh";
    }
    
    // Shrink down until text fits — can go below vhStart if needed, min 1.0vh
    while (el.scrollHeight > container.clientHeight && vh > 1.0) {
        vh -= 0.15;
        el.style.fontSize = vh + "vh";
    }
}

// ── HEBREW MONTH EXTRACTOR ────────────────────────────────────────
/**
 * Extracts month + year from Hebrew date string.
 * e.g. "ט״ו אייר תשפ״ה" → "אייר תשפ״ה"
 */
function getHebMonth(hebDate) {
    if (!hebDate) return "";
    // Hebrew date format: "day month year" — split by space, take parts [1] onward
    let parts = hebDate.trim().split(/\s+/);
    if (parts.length >= 3) return parts.slice(1).join(" ");
    if (parts.length === 2) return parts[1];
    return "";
}

// ── DONATION BOX RENDERER ─────────────────────────────────────────
/**
 * Renders donors into a box. Each entry gets equal height (flex:1).
 * Font scales down as a unit by checking the entry's own scrollHeight.
 * Month is shown in the title bar.
 */
function renderDonors(containerId, titleId, donors, hebMonth) {
    let box = EL[containerId] || document.getElementById(containerId);
    if (!box) return;

    // Update title with month
    let titleEl = EL[titleId] || document.getElementById(titleId);
    if (titleEl && hebMonth) {
        let base = titleEl.dataset.base || titleEl.innerText;
        titleEl.dataset.base = base;
        titleEl.innerText = base + " | " + hebMonth;
    }

    if (!donors || donors.length === 0) {
        box.innerHTML = '<div class="donor-entry"><div class="donor-dedication">Sponsorship Still Available</div></div>';
        return;
    }

    box.innerHTML = donors.map(d => `
        <div class="donor-entry">
            <div class="donor-dedication">${d.dedication || ""}</div>
            ${d.donor ? `<div class="donor-name">נתנדב ע"י ${d.donor}</div>` : ""}
        </div>
    `).join('');

    // Scale each entry as a unit based on its own overflow
    box.querySelectorAll('.donor-entry').forEach(entry => {
        let dedEl  = entry.querySelector('.donor-dedication');
        let nameEl = entry.querySelector('.donor-name');
        if (!dedEl) return;
        let dedVh  = 5.0, nameVh = 4.2;
        // Shrink until entry content fits within allocated height
        while (entry.scrollHeight > entry.clientHeight && dedVh > 1.0) {
            dedVh  = Math.max(1.0, dedVh  - 0.15);
            nameVh = Math.max(1.0, nameVh - 0.13);
            dedEl.style.fontSize  = dedVh  + "vh";
            if (nameEl) nameEl.style.fontSize = nameVh + "vh";
        }
    });
}

// ── MOLAD PARSING ─────────────────────────────────────────────────
function parseMoladEntry(str) {
    if (!str) return null;
    try {
        let withoutDay = str.replace(/^[^,]+,\s*/, "");
        // Chalakim clause is optional (0 chalakim omits it entirely) and uses
        // singular "chelek" for exactly 1, plural "chalakim" for 2+ — accept
        // either, and default to 0 when the whole clause is absent.
        let parts = withoutDay.match(/^(.+?),\s*(\d+):(\d+)\s*(am|pm)(?:\s+and\s+(\d+)\s+(?:chalakim|chelek))?/i);
        if (!parts) return null;
        let hour = parseInt(parts[2]), min = parseInt(parts[3]);
        let ampm = parts[4].toLowerCase(), chalakim = parts[5] ? parseInt(parts[5]) : 0;
        let extraSec = Math.round(chalakim * 10 / 3);
        if (ampm === "pm" && hour !== 12) hour += 12;
        if (ampm === "am" && hour === 12) hour = 0;
        let d = new Date(parts[1].trim() + " " + String(hour).padStart(2,"0") + ":" + String(min).padStart(2,"0") + ":00");
        if (isNaN(d.getTime())) return null;
        d.setSeconds(extraSec);
        return d;
    } catch(e) { return null; }
}

// ── KIDDUSH LEVANA ────────────────────────────────────────────────
function getKiddushLevana(now, hebDate, isShab, holidayText, dayOfWeek, cSec, alosSec, shkiaSec) {
    if (isShab) return false;
    if (holidayText && holidayText.trim() !== "" && !holidayText.includes("תשעה באב") && !holidayText.includes("יום כיפור")) return false;
    if (dayOfWeek === 5) return false;
    if (isNineDays(hebDate)) return false;
    // On Tisha B'Av (9 Av), only show KL from Alos onwards —
    // not from RT the night before when the Hebrew date first flips to 9 Av
    if (hebDate.startsWith("ט׳") && hebDate.includes("אב")) {
        if (cSec < alosSec) return false;
    }
    // Custom: never show Kiddush Levana anywhere in Tishrei until Yom Kippur
    // afternoon — mirrors the Nine Days/Tisha B'Av pattern above. 1-9 Tishrei
    // are fully blocked regardless of the Molad-timing window below; Yom
    // Kippur itself (10 Tishrei) opens back up at Shkiah, not from midnight.
    if (hebDate.includes("תשרי")) {
        let tishreiDay = extractHebDay(hebDate);
        if (tishreiDay >= 1 && tishreiDay <= 10) {
            if (tishreiDay === 10) {
                if (cSec < shkiaSec) return false;
            } else {
                return false;
            }
        }
    }
    let nowMs = now.getTime(), bestMolad = null;
    for (let mol of moladList) {
        if (mol && mol.getTime() <= nowMs && (!bestMolad || mol.getTime() > bestMolad.getTime()))
            bestMolad = mol;
    }
    if (!bestMolad) return false;
    let hrs = (nowMs - bestMolad.getTime()) / 3600000;
    return (hrs >= 72 && hrs < 360);
}
function isNineDays(hebDate) {
    if (!hebDate || !hebDate.includes("אב")) return false;
    // Use Hebrew geresh ׳ (U+05F3) — matches actual sheet format e.g. "ה׳ אב תשפ״ו"
    // Suppress 1-8 Av; Tisha B'Av (9 Av) shows KL so people know to do it that night
    for (let d of ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ז׳","ח׳"]) {
        if (hebDate.startsWith(d)) return true;
    }
    return false;
}

// ── PDF ZMANIM OVERRIDE ───────────────────────────────────────────
// Finds the PDFZmanim week (if any) covering the given ISO date.
// Returns null if no matching week — callers must fall back to the
// existing formula-based values in that case.
function findPdfZmanimOverride(iso) {
    for (let w of pdfZmanimList) {
        if (w.weekStart && w.weekEnd && iso >= w.weekStart && iso <= w.weekEnd) return w;
    }
    return null;
}

// RULE 20: Weather Display - Open-Meteo API, refresh 15 min
// ── IMAGE ROTATION (RULE 34) ───────────────────────────────────────────────
function isImageExpired(fileId) {
    if (!imageExpiryMap || !imageExpiryMap[fileId]) return false;
    const expiry = new Date(String(imageExpiryMap[fileId]).replace(' ', 'T'));
    return !isNaN(expiry.getTime()) && new Date() > expiry;
}

function getActiveImages() {
    return p1Images.filter(id => !isImageExpired(id));
}

function rotateP1() {
    if (p1Images.length === 0 || isShabbosImageActive) return;
    const img = EL['PORT_IMG'];
    if (!img) return;
    const active = getActiveImages();
    if (active.length === 0) {
        // Every uploaded image is expired — same fallback logo used
        // elsewhere (applyData's own expiry check, and the Shabbos rotation).
        const fallbackSrc = resolvedFallbackId ? "https://lh3.googleusercontent.com/d/" + resolvedFallbackId + "=w1200" : "";
        if (fallbackSrc && img.src !== fallbackSrc) {
            img.style.opacity = 0;
            setTimeout(() => { img.src = fallbackSrc; img.style.opacity = 1; }, 800);
        }
        return;
    }
    // Single active image — no cycling needed, only set src if not already showing it
    if (active.length === 1) {
        const id = (active.includes(activeImageId) ? activeImageId : active[0]) || "";
        if (id) {
            const newSrc = "https://lh3.googleusercontent.com/d/" + id + "=w1200";
            if (img.src !== newSrc) {
                img.style.opacity = 0;
                setTimeout(() => { img.src = newSrc; img.style.opacity = 1; }, 800);
            }
        }
        return;
    }
    // Rotation off — show active/first non-expired image only, skip fade if already showing it
    if (!p1Rotation) {
        const id = (active.includes(activeImageId) ? activeImageId : active[0]) || "";
        if (id) {
            const newSrc = "https://lh3.googleusercontent.com/d/" + id + "=w1200";
            if (img.src !== newSrc) {
                img.style.opacity = 0;
                setTimeout(() => { img.src = newSrc; img.style.opacity = 1; }, 800);
            }
        }
        return;
    }
    // Rotate among the non-expired images only
    if (p1Index >= active.length) p1Index = 0;
    img.style.opacity = 0;
    setTimeout(() => {
        img.src = "https://lh3.googleusercontent.com/d/" + active[p1Index] + "=w1200";
        img.style.opacity = 1;
        p1Index = (p1Index + 1) % active.length;
    }, 800);
}

// Mirrors rotateP1() but scoped to the Shabbos image list — only ever runs
// during Kodesh, and only when shabbosRotationEnabled is on and there's more
// than one Shabbos image. Otherwise updateP1Image freezes on shabbosPics[0],
// exactly like the original single-image behavior.
// Same filtering pattern as getActiveImages() (weekday), scoped to Shabbos —
// reuses the same generic isImageExpired()/imageExpiryMap, since expiry was
// never weekday-specific to begin with.
function getActiveShabbosImages() {
    return shabbosPics.filter(id => !isImageExpired(id));
}

function rotateShabbos() {
    const active = getActiveShabbosImages();
    if (active.length === 0) return;
    const img = EL['PORT_IMG'];
    if (!img) return;
    if (shabbosIndex >= active.length) shabbosIndex = 0;
    img.style.opacity = 0;
    setTimeout(() => {
        img.src = "https://lh3.googleusercontent.com/d/" + active[shabbosIndex] + "=w1200";
        img.style.opacity = 1;
        shabbosIndex = (shabbosIndex + 1) % active.length;
    }, 800);
}

function updateP1Image(isKodesh) {
    const img = EL['PORT_IMG'];
    if (!img) return;

    if (isKodesh) {
        isShabbosImageActive = true;
        const activeShabbos = getActiveShabbosImages();
        if (activeShabbos.length === 0) {
            // All Shabbos images expired (or none uploaded) — same fallback
            // logo the weekday images use when everything's expired there too.
            if (shabbosRotateTimer) { clearInterval(shabbosRotateTimer); shabbosRotateTimer = null; }
            if (p1RotateTimer) { clearInterval(p1RotateTimer); p1RotateTimer = null; }
            const fallbackSrc = resolvedFallbackId ? "https://lh3.googleusercontent.com/d/" + resolvedFallbackId + "=w1200" : "";
            if (fallbackSrc && img.src !== fallbackSrc) {
                img.style.opacity = 0;
                setTimeout(() => { img.src = fallbackSrc; img.style.opacity = 1; }, 800);
            }
        } else if (shabbosRotationEnabled && activeShabbos.length > 1) {
            // Rotate among the non-expired Shabbos images — stop the regular
            // weekday timer (if it was somehow still running) and start a
            // Shabbos one instead, same cadence as weekday rotation.
            if (p1RotateTimer) { clearInterval(p1RotateTimer); p1RotateTimer = null; }
            if (!shabbosRotateTimer) {
                rotateShabbos();
                shabbosRotateTimer = setInterval(rotateShabbos, 14000);
            }
        } else {
            // Default (unchanged) behavior: freeze on the first non-expired Shabbos image.
            if (shabbosRotateTimer) { clearInterval(shabbosRotateTimer); shabbosRotateTimer = null; }
            if (p1RotateTimer) { clearInterval(p1RotateTimer); p1RotateTimer = null; }
            const shabbosSrc = "https://lh3.googleusercontent.com/d/" + activeShabbos[0] + "=w1200";
            if (img.src !== shabbosSrc) {
                img.style.opacity = 0;
                setTimeout(() => { img.src = shabbosSrc; img.style.opacity = 1; }, 800);
            }
        }
    } else {
        // Only restart weekday rotation if we were previously frozen/rotating for Shabbos
        if (isShabbosImageActive) {
            isShabbosImageActive = false;
            if (shabbosRotateTimer) { clearInterval(shabbosRotateTimer); shabbosRotateTimer = null; }
            shabbosIndex = 0;
            const activeImgs = getActiveImages();
            if (activeImgs.length > 1 && p1Rotation) {
                rotateP1();
                p1RotateTimer = setInterval(rotateP1, 14000);
            } else {
                rotateP1(); // single image or rotation off
            }
        }
    }
}
